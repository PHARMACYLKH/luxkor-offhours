  :root { --green:#0f613b; --green-dark:#0b4a2d; --green-soft:#e7f1ec; --gold:#a27e2c; --gold-soft:#f7f0de; --red:#b42318; --red-soft:#fdecea;

  * { box-sizing:border-box; }

  .chip { flex-shrink:0; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font:inherit; font-size:13.5px; cursor:pointer; color:var(--text); white-space:nowrap; transition:background .15s; }

บ่งใช้",["Cardiac arrest, ภาวะช็อก/ความดันโลหิตต่ำ, Anaphylaxis, Bronchospasm"]],["ขนาดยาผู้ใหญ่",["• Cardiac arrest: 1 mg IV ทุก 3–5 นาที","• Anaphylaxis: IM/SC 0.1–0.5 mg ทุก 5–20 นาที (สูงสุด 1 mg/ครั้ง)","• Hypotension: IV infusion 1–10 mcg/min หรือ 0.01–2 mcg/kg/min ปรับตามการตอบสนอง"]],["ขนาดยาเด็ก",["Cardiac arrest/Bradycardia: 0.01 mg/kg IV (0.1 mL/kg ของ 1:10,000) ทุก 3–5 นาที สูงสุด 1 mg/ครั้ง; Anaphylaxis: IM 0.01 mg/kg ทุก 5–15 นาที; Hypotension: 0.05–1 mcg/kg/min (สูงสุด 2 mcg/kg/min)"]],["การเตรียม/ผสม",["• IM/SC ใช้ความเข้มข้น 1 mg/mL (1:1,000) เท่านั้น","• IV bolus: เจือจาง 1 amp + NSS หรือ D5W 9 mL = 1:10,000 (100 mcg/mL)","• IV infusion: 10 mg (10 amp) + D5W/NSS 90 mL = 100 mcg/mL หรือ 6 mg (6 amp) + D5W/NSS 94 mL = 60 mcg/mL (ที่ 60 mcg/mL อัตรา mL/hr = mcg/min)","• สารน้ำที่เข้ากันได้: D5W, D5S, NSS, D5S/2, LRS","• คงตัว 24 ชม. ที่อุณหภูมิห้องหรือตู้เย็น เก็บพ้นแสง"]],["การบริหารยา",["• IV infusion ต้องใช้ infusion pump ทุกครั้ง","• IV bolus นอกเหนือจาก cardiac arrest ให้ฉีดช้าๆ 5–10 นาที (ใช้ IV push เฉพาะ anaphylactic shock รุนแรง)","• หลีกเลี่ยงการฉีด IM ที่สะโพก (หลอดเลือดหดตัวจนกล้ามเนื้อตาย)","• ห้ามผสมกับสารละลายด่าง (NaHCO3) และ aminophylline"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้ในผู้ป่วยความดันโลหิตสูง (ยกเว้นข้อบ่งใช้ช่วยชีวิต); ระวังในโรคหัวใจเต้นผิดจังหวะ และโรคหลอดเลือดส่วนปลาย"]],["การติดตาม",["BP ทุก 3–5 นาทีช่วง resuscitation จน stable → ทุก 15 นาที x 8 ครั้ง (2 ชม.) → ทุก 1 ชม. จนหยุดยา; HR (keep 50–120); Anaphylaxis ติดตามทุก 10 นาทีจนครบ 30 นาที; ตรวจ IV site และปลายมือปลายเท้า"]],["เกณฑ์แจ้งแพทย์",["ผู้ใหญ่ HR > 120 ครั้ง/นาที, BP > 160/100 mmHg; เด็ก HR > 180, BP > 120/80; ผิวซีดเย็น/เขียว; หลอดเลือดอักเสบที่ IV site"]],["อาการไม่พึงประสงค์",["Tachycardia, arrhythmia, ความดันสูง (ให้เร็วอาจเกิดเลือดออกในสมอง), peripheral limb ischemia, extravasation → เนื้อตาย, phlebitis, ปวดศีรษะ, แน่นหน้าอก, หอบเหนื่อย"]],["อันตรกิริยาสำคัญ",["ห้ามใช้ร่วมกับ linezolid, dihydroergotamine; MAOIs (phenelzine, isocarboxazid, tranylcypromine) เสี่ยง hypertensive crisis ควรเว้นห่าง ≥ 14 วัน"]],["การแก้ไขพิษ",["Agitation: haloperidol 2–5 mg IM; ชัก: diazePAM IV; Arrhythmia: beta-blocker เช่น propranolol; Hyperthermia: ลดอุณหภูมิ"]],["เอกสารอ้างอิง",["[7], [8], [9], [10], [11]"]]]},"HAD-02":{"id":"HAD-02","title":"Amiodarone INJ (150 mg/ 3 mL) 3 mL (Eurythmic®) (HAD)","rows":[["กลุ่มยา",["Antiarrhythmic"]],["ข้อบ่งใช้",["Ventricular arrhythmias; Rapid atrial arrhythmia (AF/AFL with RVR)"]],["ขนาดยาผู้ใหญ่",["• Cardiac arrest (VF/pulseless VT): 300 mg IV push (เจือจาง D5W) อาจให้ซ้ำ 150 mg ทุก 3–5 นาที","• Ventricular arrhythmia (24 ชม.แรก รวม ~1,000 mg): 150 mg ใน D5W 100 mL ใน 10 นาที (15 mg/min) → 360 mg ใน 6 ชม. (1 mg/min) → 540 mg ใน 18 ชม. (0.5 mg/min); maintenance 0.5 mg/min","• AF: 150–300 mg IV drip ใน 1 ชม. แล้ว maintenance ตามแพทย์สั่ง","• ขนาดสูงสุด 2–2.2 g/24 ชม.; อัตราเร็วสูงสุด 30 mg/min"]],["ขนาดยาเด็ก",["Loading 5 mg/kg drip ใน 20–60 นาที; maintenance 7–15 mcg/kg/min; เลี่ยงใช้ในเด็ก < 2 ปี (มี benzyl alcohol)"]],["การเตรียม/ผสม",["• ผสมใน D5W เท่านั้น (ใน NSS อาจตกตะกอน)","• Peripheral line ความเข้มข้น ≤ 2 mg/mL; > 2 mg/mL ให้ทาง central line เท่านั้น (สูงสุด 6 mg/mL)"]],["การบริหารยา",["IV push ช้าๆ (150 mg ใน ≥ 10 นาที, ≤ 30 mg/min) ยกเว้นกรณีกู้ชีพ; infusion ใช้ infusion pump"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ amiodarone/iodine, QTc prolongation/TdP, SA node disease รุนแรง, 2nd–3rd degree AV block, cardiogenic shock, bradycardia; ระวัง: ความผิดปกติของไทรอยด์, หญิงตั้งครรภ์ (category D ยกเว้นจำเป็น เช่น CPR)"]],["การติดตาม",["BP ทุก 5 นาทีช่วง resuscitation → ทุก 15 นาที x 8 → ทุก 1 ชม.; HR ตลอดการให้ยา; baseline, ทุก 15 นาที x 3 แล้วทุก 4 ชม. ตลอดการให้ยาและหลังหยุดยา 24 ชม.; ECG 12 lead ทุก 24 ชม. (AV block, bradycardia, QT)"]],["เกณฑ์แจ้งแพทย์",["HR < 60 หรือ > 120 ครั้ง/นาที (หรือนอกช่วงเป้าหมายที่แพทย์กำหนด เช่น keep 70–110); BP < 90/60 mmHg; RR < 12; ปวดที่ IV site (ลดอัตราเร็วหรือหยุดยา)"]],["อาการไม่พึงประสงค์",["Sinus bradycardia, heart block, hypotension, QT prolongation/torsades de pointes, hyper/hypothyroidism, DRESS, corneal microdeposits; ยากิน: คลื่นไส้, ไอแห้ง/หายใจขัด, เดินเซ/ชาปลายเท้า, ตัวเหลือง, ตามัว/แพ้แสง; ผิวไวต่อแสง"]],["อันตรกิริยาสำคัญ",["ยามีฤทธิ์นาน 7–50 วันหลังหยุดยา แจ้งแพทย์ทันทีเมื่อใช้ร่วม/ปรับขนาด: digoxin (ฤทธิ์ ↑ 2 เท่า), phenytoin (↑ 2–3 เท่า), warfarin (ลดขนาด warfarin 35–65%), quinolones (QT/TdP), ritonavir/protease inhibitors, fentaNYL (bradycardia, hypotension, complete heart block)"]],["เอกสารอ้างอิง",["[7], [8], [12]"]]]},"HAD-03":{"id":"HAD-03","title":"Calcium Gluconate INJ 10% (4.5 mEq/ 10 mL) 10 mL (GPO®) (HAD)","rows":[["กลุ่มยา",["Concentrated electrolyte"]],["ความแรง",["10% = 100 mg/mL; 1 amp (10 mL) = 1 g = 4.5 mEq Ca"]],["ข้อบ่งใช้",["Hypocalcemia; Cardiotoxicity จาก hyperkalemia; ภาวะพิษจาก magnesium"]],["ขนาดยาผู้ใหญ่",["• Hyperkalemia: 1 g (10 mL) IV ช้าๆ > 5 นาที (ติดตาม ECG ขณะฉีด)","• Hypocalcemia: infusion 2–15 g/24 ชม."]],["ขนาดยาเด็ก",["Hypocalcemia: ทารกแรกเกิด 2–8 mL/kg/วัน, เด็ก 2–5 mL/kg/วัน แบ่งให้ทุก 6 ชม.; IV push ไม่เกิน 100 mg/min"]],["การเตรียม/ผสม",["• สารน้ำที่เข้ากันได้: D5W, D10W, NSS, D5S, LRS","• Infusion: 1 g/50 mL D5W หรือ 1 amp/100 mL (10 mg/mL); ความเข้มข้นสูงสุด 50 mg/mL","• ห้ามผสมกับสารละลายที่มี bicarbonate, phosphate, sulfate (MgSO4), carbonate, tartrate, TPN (ตกตะกอน)"]],["การบริหารยา",["• ห้าม IM/SC (เนื้อตาย)","• ให้แบบไม่เจือจางได้ แต่ต้องฉีดช้า > 5 นาที ห้าม IV push เร็ว","• อัตราเร็ว infusion ทั่วไป ≤ 50 mg/min และห้ามเกิน 200 mg/min (ความดันต่ำเฉียบพลัน ช็อก เสียชีวิตได้)","• ให้ขนาดสูง/เร็ว ควรตรวจ serum phosphate"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้ใน digoxin intoxication; ระวังในผู้ที่ได้ digoxin, hyperphosphatemia, hypokalemia, hypomagnesemia, นิ่วในไต, ไตบกพร่อง"]],["การติดตาม",["Infusion: BP ทุก 15 นาที x 4 → ทุก 1 ชม. x 2 → ทุก 4 ชม.; ECG ขณะ slow push; Ca ทุก 4–8 ชม.; K, PO4, Mg; IV site"]],["เกณฑ์แจ้งแพทย์",["SBP < 90 mmHg, HR < 60; Ca > 10.5 mg/dL, PO4 > 4.5 mg/dL; ECG ผิดปกติ; หลอดเลือดอักเสบ"]],["อาการไม่พึงประสงค์",["Hypotension/vasodilatation, bradycardia, arrhythmia, extravasation/เนื้อตาย; Hypercalcemia: คลื่นไส้อาเจียน เบื่ออาหาร กระหายน้ำ ท้องผูก ปวดกระดูก ST depression/short QT"]],["อันตรกิริยาสำคัญ",["Digoxin (เพิ่มฤทธิ์ digoxin)"]],["เอกสารอ้างอิง",["[7], [13], [14]"]]]},"HAD-04":{"id":"HAD-04","title":"Cisatracurium INJ (2 mg/mL) 5 mL (Nimbex®) (HAD)","rows":[["กลุ่มยา",["Neuromuscular blocking agent"]],["ข้อบ่งใช้",["Induction–intubation; คลายกล้ามเนื้อในผู้ป่วยที่ใช้เครื่องช่วยหายใจ (ใช้เฉพาะหน่วยวิกฤต)"]],["ขนาดยาผู้ใหญ่",["Loading 0.1–0.2 mg/kg IV; maintenance 0.5–10 mcg/kg/min (เริ่ม drip หลัง bolus 40–60 นาที); ไม่ต้องปรับขนาดในไต/ตับบกพร่อง; ผู้ป่วยอ้วนใช้ IBW"]],["ขนาดยาเด็ก",["Loading 0.1–0.15 mg/kg; infusion 1–4 mcg/kg/min"]],["การเตรียม/ผสม",["• สารน้ำ: D5W, NSS; ความเข้มข้นทั่วไป 0.4 mg/mL; คงตัว 24 ชม. ที่ 5–25 °C (0.1–0.4 mg/mL)","• ห้ามผสมกับ thiopental หรือยาที่เป็นด่าง (ยาถูกทำลาย)","• สารละลาย hypotonic ห้ามให้ทางสายเดียวกับเลือด"]],["การบริหารยา",["IV bolus ไม่เจือจางให้ใน 5–10 วินาที; flush ด้วย NSS ก่อน/หลังเมื่อใช้สายร่วม; infusion ใช้ infusion pump"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ atracurium/cisatracurium/benzenesulfonic acid; ระวัง: แพ้ NMB อื่น, ผู้สูงอายุ, หญิงตั้งครรภ์; ใช้เฉพาะผู้ป่วยที่มีการดูแลทางเดินหายใจ/ช่วยหายใจ ในหน่วยงานที่มีความพร้อม"]],["การติดตาม",["ระดับการรู้สึกตัว/sedation, ventilator, ABG; RR, SpO2, HR, BP ทุก 2–5 นาที x 30 นาทีแรก → ทุก 15 นาที x 2 → ทุก 30 นาที x 2 (ชม.ที่ 2) → ทุก 1 ชม."]],["เกณฑ์แจ้งแพทย์",["BP < 90/60 หรือ MAP < 65 หรือลดลง > 20% จาก baseline; HR เพิ่ม/ลด > 20%; SpO2 < 94%"]],["อาการไม่พึงประสงค์",["Bradycardia, malignant hyperthermia, hypersensitivity, seizure, กล้ามเนื้ออ่อนแรง"]],["อันตรกิริยาสำคัญ",["ไม่ควรใช้ร่วม succinylcholine (prolonged/complex block); เสริมฤทธิ์: ยาดมสลบ, aminoglycosides, tetracyclines, clindamycin, lincomycin, furosemide, MgSO4, ketamine, lithium"]],["ยาแก้ฤทธิ์",["Neostigmine"]],["เอกสารอ้างอิง",["[15], [16]"]]]},"HAD-05":{"id":"HAD-05","title":"DOBUTamine INJ (250 mg/ 5 mL) 5 mL (Dobutel®) (HAD)","rows":[["กลุ่มยา",["Inotrope"]],["ความแรง",["⟦ของ รพ . 250 mg/5 mL (50 mg/mL) ต่าง จาก ตาราง ผสม ยา ทั่วไป ที่ ใช้ 250 mg/20 mL (12.5 mg/mL) — ห้าม ใช้ ปริมาตร (mL) จาก ตาราง ภายนอก ให้ คำนวณ เป็น mg เสมอ⟧"]],["ข้อบ่งใช้",["Congestive heart failure, low cardiac output"]],["ขนาดยาผู้ใหญ่",["เริ่ม 0.5–1 mcg/kg/min; maintenance 2–20 mcg/kg/min; สูงสุด 40 mcg/kg/min; ความเข้มข้นสูงสุด 5 mg/mL"]],["ขนาดยาเด็ก",["2–25 mcg/kg/min ปรับทีละ 1 mcg/kg/min ทุก 15 นาที"]],["การเตรียม/ผสม",["• สารน้ำ: D5W, NSS, D10W, D5S, D5S/2, LRS","• ตัวอย่าง (คำนวณใหม่สำหรับความแรงของ รพ.): 250 mg (5 mL) + สารน้ำ up to 250 mL = 1 mg/mL; 500 mg (10 mL) up to 250 mL = 2 mg/mL","• อัตรา (mL/hr) = dose (mcg/kg/min) x น้ำหนัก (kg) x 60 ÷ ความเข้มข้น (mcg/mL)","• ยาผสมแล้วใช้ภายใน 24 ชม. สีชมพูไม่มีผลต่อความแรง แต่สีน้ำตาลเข้มห้ามใช้"]],["การบริหารยา",["IV infusion ผ่าน infusion pump เท่านั้น; ปรับขนาดช้าๆ; หลอดเลือดดำใหญ่; ห้ามผสมกับสารละลายด่าง (NaHCO3)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ระวังในโรคหัวใจเต้นผิดจังหวะ, ความดันต่ำ, แพ้ sulfite (มี sodium bisulfite)"]],["การติดตาม",["BP/HR ทุก 3–5 นาทีช่วงปรับยา → ทุก 15 นาที x 8 → ทุก 1 ชม.; IV site ทุก 8 ชม.; urine output"]],["เกณฑ์แจ้งแพทย์",["HR > 120 ครั้ง/นาที; MAP < 65 หรือ BP < 90/60 หรือ > 160/100; urine output < 25 mL/hr; ผิวซีดเย็น"]],["อาการไม่พึงประสงค์",["Rapid ventricular response ใน AF, ventricular ectopy, เพิ่ม infarct size ใน MI, hypotension, hypokalemia, ใจสั่น, เจ็บหน้าอก, หายใจลำบาก"]],["อันตรกิริยาสำคัญ",["ห้ามใช้ร่วมกับ ergotamine, linezolid"]],["เอกสารอ้างอิง",["[17], [10], [18]"]]]},"HAD-06":{"id":"HAD-06","title":"DOPamine INJ (250 mg/ 10 mL) 10 mL (Inopin®) (HAD)","rows":[["กลุ่มยา",["Inotrope/Vasopressor"]],["ข้อบ่งใช้",["Bradyarrhythmia, cardiogenic shock, CHF, septic shock (เป็นตัวที่ 2 หลัง NORepinephrine)"]],["ขนาดยาผู้ใหญ่",["Low 1–5, intermediate 5–10, high 10–20 mcg/kg/min; สูงสุด 50 mcg/kg/min (ตารางอัตราเร็วมาตรฐานกำหนดสูงสุด 20 mcg/kg/min)"]],["ขนาดยาเด็ก",["1–20 mcg/kg/min; fluid refractory shock เริ่ม 10 mcg/kg/min ปรับทีละ 1 ทุก 15 นาที; สูงสุด 20 mcg/kg/min"]],["การเตรียม/ผสม",["• สารน้ำ: D5W, NSS, D5S, D10S, D10S/2, LRS; ความเข้มข้นสูงสุด 3.2 mg/mL","• ตัวอย่าง: 250 mg (10 mL = 1 amp) up to 250 mL = 1 mg/mL; 500 mg (20 mL) up to 250 mL = 2 mg/mL","• เด็ก: 6 mg/kg ใน D5W 100 mL → 1 mL/hr = 1 mcg/kg/min","• ยาผสมใช้ภายใน 24 ชม.; สีเหลืองเข้มขึ้นหรือชมพูห้ามใช้"]],["การบริหารยา",["Infusion pump; ห้าม IV bolus; ห้ามผสมกับสารละลายด่าง (NaHCO3), amphotericin B, ampicillin, gentamicin, KCl; ห้าม Y-site กับ furosemide, regular insulin; หลอดเลือดดำใหญ่/central line"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้ในผู้ป่วยความดันโลหิตสูง; ระวังในโรคหัวใจเต้นผิดจังหวะ"]],["การติดตาม",["BP ทุก 3–5 นาทีช่วงปรับยา → ทุก 15 นาที x 8 → ทุก 1 ชม.; HR (keep 50–120); IV site ทุก 8 ชม.; urine output; ปลายมือเท้า"]],["เกณฑ์แจ้งแพทย์",["HR > 120; MAP < 65 หรือ BP < 90/60 หรือ > 160/100; urine output < 25 mL/hr; ผิวซีดเย็น/เขียว"]],["อาการไม่พึงประสงค์",["Tachycardia, arrhythmia, ความดันสูง, peripheral ischemia, extravasation/เนื้อตาย, phlebitis, คลื่นไส้, ใจสั่น, เจ็บหน้าอก"]],["อันตรกิริยาสำคัญ",["ห้ามใช้ร่วม ergotamine, linezolid; ระวัง amitriptyline, phenytoin, traZODone; ยาลดฤทธิ์: chlorpromazine, haloperidol, fluphenazine, metoCLOPRAMIDE"]],["เอกสารอ้างอิง",["[7], [17], [10], [19]"]]]},"HAD-07":{"id":"HAD-07","title":"fentaNYL INJ (100 mcg/ 2 mL) 2 mL (Fentanyl Hameln®) (HAD)","rows":[["กลุ่มยา",["Opioid"]],["ข้อบ่งใช้",["ปวดหลังผ่าตัด, anesthesia, ระงับปวด/sedation ในผู้ป่วยใช้เครื่องช่วยหายใจ"]],["ขนาดยาผู้ใหญ่",["Loading 1 mcg/kg IV ช้าๆ (สูงสุด 50 mcg) หรือ bolus 0.35–0.5 mcg/kg; maintenance 1–4 mcg/kg/hr — ขนาดสูงกว่านี้ (ถึง 10 mcg/kg/hr) ให้ตามแพทย์สั่งเท่านั้น; ปรับครั้งละ 25 mcg/hr ทุก 30 นาที"]],["ขนาดยาเด็ก",["Loading 1 mcg/kg (สูงสุด 50 mcg); maintenance 1–2 mcg/kg/hr"]],["การเตรียม/ผสม",["• 10 mcg/mL: 1,000 mcg (10 amp ของ รพ. = 20 mL) + NSS/D5W up to 100 mL; 5 mcg/mL: 500 mcg (5 amp) up to 100 mL","• หลังเจือจางใช้ทันที หรือไม่เกิน 24 ชม. ที่ 2–8 °C"]],["การบริหารยา",["I unit/kg แล้วเพิ่มอัตรา 2 unit/kg/hr","• 1.5–2.3 เท่า: ไม่ปรับขนาด (อยู่ในช่วงเป้าหมาย)","• 2.3–3.0 เท่า: ลดอัตรา 2 unit/kg/hr","• > 3.0 เท่า: หยุดยา 1 ชม. แล้วลดอัตรา 3 unit/kg/hr","• ACS: เป้าหมาย aPTT 1.5–2.0 เท่าของค่า control [63], [64]","• เด็ก: ปรับขนาดตามแพทย์สั่ง เป้าหมาย aPTT ที่เทียบกับ anti-Xa 0.35–0.7 IU/mL [66]","• เมื่อห้องปฏิบัติการของ รพ. กำหนดช่วงการรักษาของ aPTT เทียบกับ anti-Xa 0.3–0.7 IU/mL แล้ว ให้ใช้ช่วงนั้นแทน [22], [65]"]],["การเตรียม/ผสม",["• 100 unit/mL: 10,000 unit (2 mL) + D5W/NSS up to 100 mL; 50 unit/mL: 5,000 unit (1 mL) up to 100 mL; ความเข้มข้นทั่วไป 50–100 unit/mL","• พลิกขวดให้เข้ากันก่อนให้; ใช้ภายใน 24 ชม.","• ปริมาตรที่ต้องดูด (mL) = unit ที่ต้องการ ÷ 5,000"]],["การบริหารยา",["• ห้าม IM","• Infusion ผ่าน pump ตรวจ pump อย่างน้อยทุก 2 ชม.","• SC: ฉีด deep SC หน้าท้องห่างสะดือ > 2 นิ้ว กดเบาๆ 5–10 วินาที ห้ามนวด เปลี่ยนตำแหน่ง"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยา, uncontrolled bleeding, platelet < 100,000/mm3, ประวัติ HIT; ไม่ให้ภายใน 24 ชม. หลัง rt-PA; ระวัง: on epidural catheter, เพิ่งผ่าตัดศีรษะ/กระดูกสันหลัง/ตา, เสี่ยงเลือดออก GI/GU, ตับบกพร่องรุนแรง"]],["การติดตาม",["aPTT ก่อนให้ยาและ 6 ชม. หลังเริ่ม/ปรับขนาด หรือทุก 4–6 ชม. จนอยู่ในช่วงเป้าหมาย 2 ครั้งติดกัน แล้ววันละครั้ง [62]; SC: ก่อนและหลัง 6 ชม.; CBC/platelet ก่อนเริ่มและทุก 2–3 วันหากให้ > 3 วัน จนถึงวันที่ 14 (เฝ้าระวัง HIT) [67]; Hb; K; อาการเลือดออก"]],["เกณฑ์แจ้งแพทย์",["aPTT > 3 เท่าของค่า control; platelet < 100,000/mm3; Hb ลดลง > 2 g/dL; มีเลือดออก/neuro sign เปลี่ยน; HR > 120 หรือ < 60, BP < 90/60"]],["อาการไม่พึงประสงค์",["เลือดออก (major/minor), HIT/HITT (วันที่ 5–10 หลังเริ่ม อาจช้าถึง 3 เดือน ประเมินด้วย 4T score และหยุดยาทันทีหากวินิจฉัย), anaphylaxis"]],["ยาต้านพิษ/การแก้ไข",["Minor bleeding: หยุดชั่วคราวจนเลือดหยุดและ aPTT ลดลง แล้วให้ต่อในขนาดที่ลดลง; Major bleeding: หยุดยาทันทีและแจ้งแพทย์ (ฤทธิ์ของ heparin หมดภายในไม่กี่ชั่วโมงหลังหยุดยา) ให้การรักษาประคับประคองและให้เลือด/ส่วนประกอบของเลือดตามแพทย์สั่ง ตรวจ aPTT และ CBC ซ้ำ"]],["เอกสารอ้างอิง",["[22], [23], [62]–[67]"]]]},"HAD-09":{"id":"HAD-09","title":"Lidocaine INJ (LOCAL & IV) 2% 5 mL (Chalocard®) (HAD)","rows":[["กลุ่มยา",["Antiarrhythmic"]],["ขอบเขต",["จัดเป็น HAD เมื่อใช้ทางหลอดเลือดดำ (IV) เพื่อรักษา ventricular arrhythmia; การใช้เป็นยาชาเฉพาะที่ปฏิบัติตามแนวทางยาชา"]],["ขนาดยาผู้ใหญ่",["Initial 1–1.5 mg/kg IV bolus; ซ้ำ 0.5–0.75 mg/kg ทุก 5–10 นาทีถ้าจำเป็น (สูงสุดสะสม 3 mg/kg); maintenance 1–4 mg/min (30–50 mcg/kg/min); ทาง endotracheal 2–2.5 เท่าของขนาด IV เจือจางใน NSS 5–10 mL"]],["ขนาดยาเด็ก",["0.5–1 mg/kg IV ช้าๆ ใน 5 นาที ซ้ำได้ทุก 10 นาที (bolus รวมไม่เกิน 5 mg/kg); maintenance 10–50 mcg/kg/min"]],["ความแรง",["2% = 20 mg/mL; 1 vial (5 mL) = 100 mg — คำนวณเป็น mg เสมอ (ปริมาตรเท่ากับ 1% 5 mL เดิม แต่ตัวยาเป็น 2 เท่า)"]],["การเตรียม/ผสม",["• สารน้ำ: D5W, LRS, NSS, NSS/2, D5S, D5S/2","• Bolus 1–1.5 mg/kg ไม่ต้องเจือจาง: ผู้ใหญ่ 60 kg = 60–90 mg = 3–4.5 mL","• Infusion 4 mg/mL: 1 g (10 vial = 50 mL) + D5W 200 mL = 250 mL → 1 mg/min = 15 mL/hr, 2 mg/min = 30 mL/hr, 4 mg/min = 60 mL/hr","• จำกัดน้ำ 8 mg/mL (สูงสุด): 2 g (20 vial = 100 mL) + D5W 150 mL = 250 mL → 1 mg/min = 7.5 mL/hr"]],["การบริหารยา",["IV slowly push อย่างน้อย 2–3 นาที (ไม่ต้องเจือจาง); infusion ผ่าน pump; ห้ามใช้ Lidocaine ที่ผสม Adrenaline ทางหลอดเลือดดำเด็ดขาด และเก็บแยกตำแหน่ง"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามให้ IV ใน AV block, SA node disorder, porphyria"]],["การติดตาม",["BP ทุก 3–5 นาทีช่วง resuscitation → ทุก 15 นาที x 8 → ทุก 1 ชม.; HR ตลอดการให้ยา; อาการพิษของ lidocaine"]],["เกณฑ์แจ้งแพทย์",["Bradycardia, VT, ชัก, hypotension"]],["อาการไม่พึงประสงค์ (พิษ)",["สับสน, ตื่นเต้น, ตามัว, คลื่นไส้อาเจียน, หูอื้อ, สั่น, กระตุก, ชัก, หายใจลำบาก, เวียนศีรษะ, เป็นลม, ชีพจรช้า"]],["อันตรกิริยาสำคัญ",["ห้ามใช้ร่วม ergot alkaloids, dronedarone, saquinavir; propofol เสริมฤทธิ์ทำให้หลับ"]],["เอกสารอ้างอิง",["[7], [8], [24]"]]]},"HAD-10":{"id":"HAD-10","title":"Magnesium Sulfate (MgSO4) INJ 50% (1 g/ 2 mL) 2 mL (Atlantic) (HAD)","rows":[["กลุ่มยา",["Concentrated electrolyte"]],["ค ัง",["ห้ามใช้ในผู้ป่วยความดันโลหิตสูง; ระวังโรคหัวใจเต้นผิดจังหวะ, โรคหลอดเลือดส่วนปลาย"]],["การติดตาม",["BP ทุก 3–5 นาที (หรือ 10–15 นาที) จนถึงเป้าหมาย → ทุก 15 นาที x 8 → ทุก 1 ชม.; HR (keep 50–120); IV site/extravasation, ปลายมือเท้า ทุก 1 ชม."]],["เกณฑ์แจ้งแพทย์",["MAP < 65 แม้ปรับถึงขนาดที่แพทย์กำหนด; ผู้ใหญ่ HR > 120, BP > 160/100; เด็ก HR > 180, BP > 120/80; ผิวซีดเย็น/เขียว; IV site อักเสบ"]],["อาการไม่พึงประสงค์",["Tachycardia, arrhythmia, ความดันสูง, peripheral ischemia, extravasation/เนื้อตาย, phlebitis, ปวดศีรษะ, เหงื่อออก, แน่นหน้าอก"]],["อันตรกิริยาสำคัญ",["ห้ามใช้ร่วม linezolid (ยกเว้นติดตาม BP ใกล้ชิด), isocarboxazid, phenelzine, dihydroergotamine; ระวัง MAOIs (selegiline, moclobemide), TCAs"]],["เอกสารอ้างอิง",["[10], [32]"]]]},"HAD-16":{"id":"HAD-16","title":"Pethidine INJ (50 mg/mL) 1 mL (Pethidine FDA***) (HAD)","rows":[["กลุ่มยา",["Opioid"]],["ข้อบ่งใช้",["ปวดปานกลางถึงรุนแรง; premedication ก่อนผ่าตัด 30–90 นาที"]],["ขนาดยา",["SC/IM ≤ 100 mg/ครั้ง ทุก 3–4 ชม.; ไม่ควรเกิน 600 mg/วัน และไม่ควรใช้นานเกิน 48 ชม."]],["การเตรียม/การบริหาร",["IV push เจือจางด้วย sterile water ให้ ≤ 10 mg/mL ฉีดช้าๆ ≥ 5 นาที"]],["ข้อห้ามใช้/ข้อควรระวัง",["• ไม่ใช้สำหรับปวดเรื้อรัง (เสี่ยงติดยา)","• ขนาดสูง/ใช้นานเกิด neurotoxicity จาก active metabolite: สั่น กระวนกระวาย สับสน หูแว่ว ชัก โดยเฉพาะผู้ป่วยโรคไตและผู้สูงอายุ","• ห้ามใช้ร่วม MAOIs (selegiline) ต้องหยุด > 2 สัปดาห์","• ไม่ใช้ในผู้บาดเจ็บที่ศีรษะ"]],["การติดตาม",["ทุก 1 ชม. x 4 แล้วทุก 4 ชม.: RR, BP, HR, sedation score, pain score; รูม่านตา/SpO2 ตามแพทย์สั่ง"]],["เกณฑ์แจ้งแพทย์",["RR < 12, BP < 90/60, HR < 60, sedation score ≥ 2, pain score ≥ 4, รูม่านตาขยาย > 4 mm, SpO2 < 94%"]],["อาการไม่พึงประสงค์",["กดการหายใจ, ปวดศีรษะ, สับสน, เกร็งกระตุก/ชัก, ปากแห้ง, คลื่นไส้อาเจียน, ท้องผูก"]],["ยาต้านพิษ",["Naloxone 0.2 mg IV/IM/SC ซ้ำได้ทุก 2–3 นาที 2 ครั้ง แล้วปรึกษาวิสัญญีแพทย์"]],["เอกสารอ้างอิง",["[1], [33]"]]]},"HAD-17":{"id":"HAD-17","title":"Potassium Chloride (KCl) INJ (20 mEq / 10 mL) 10 mL (PINYO) (HAD)","r ก่อนให้; ห้าม IM/SC; flush ด้วย NSS หลังให้ยา"]],["ข้อห้ามใช้/ข้อควรระวัง",["ระวัง: extravasation (เนื้อเยื่อตาย), ผู้ป่วยติดสุรา/ขาดสารอาหาร ให้ thiamine ก่อนหรือพร้อมกัน, ภาวะน้ำตาลสูง, hypokalemia"]],["การติดตาม",["POCT glucose 15 นาทีหลังให้ยาและซ้ำจนคงที่; กรณี hyperkalemia ร่วม insulin: POCT ทุก 1 ชม. x 6 ชม. และ K ซ้ำใน 1–2 ชม.; IV site ระหว่างและหลังให้ยา"]],["เกณฑ์แจ้งแพทย์",["POCT < 70 mg/dL ซ้ำ หรือ > 250 mg/dL; K < 3.5 mEq/L; IV site บวม แดง ปวด หรือซีด"]],["อาการไม่พึงประสงค์",["Hyperglycemia, hypokalemia, หลอดเลือดดำอักเสบ, extravasation, ปัสสาวะมาก (osmotic diuresis)"]],["การแก้ไข",["Extravasation: หยุดให้ยาทันที ดูดยาที่ค้างออกทางเข็มเดิม ถอดเข็ม ยกส่วนนั้นสูง แจ้งแพทย์และเฝ้าระวังเนื้อเยื่อ"]],["เอกสารอ้างอิง",["[1], [43], [37], [7]"]]]},"HAD-23":{"id":"HAD-23","title":"Sodium Bicarbonate (NaHCO3) INJ 7.5% 50 mL (Atlantic) (HAD)","rows":[["กลุ่มยา",["Concentrated electrolyte (alkalinizing agent)"]],["ความแรง",["7.5% = 0.89 mEq/mL; 1 ขวด (50 mL) = 44.6 mEq Na และ HCO3; สารละลายเข้มข้นสูง (hyperosmolar)"]],["ข้อบ่งใช้",["Severe metabolic acidosis (pH < 7.20) โดยเฉพาะร่วมกับไตวายเฉียบพลัน; hyperkalemia ที่มี acidosis ร่วม; พิษจากยากลุ่ม sodium channel blocker (เช่น tricyclic antidepressant) ที่มี QRS กว้าง; หัวใจหยุดเต้นจาก hyperkalemia หรือพิษยาดังกล่าว (ไม่ใช้เป็นประจำในการกู้ชีพ)"]],["ขนาดยาผู้ใหญ่",["• Metabolic acidosis: ตามแพทย์สั่ง คำนวณ HCO3 deficit = 0.5 x น้ำหนัก (kg) x (HCO3 เป้าหมาย − HCO3 ที่วัดได้) ให้ครึ่งหนึ่งก่อนแล้วประเมิน ABG/VBG ซ้ำ","• พิษ TCA (QRS > 120 ms): 1–2 mEq/kg IV bolus ซ้ำได้จน QRS แคบลงหรือ pH 7.45–7.55","• Cardiac arrest จาก hyperkalemia/พิษ TCA: 1 mEq/kg (≈ 50 mEq) IV push"]],["ขนาดยาเด็ก",["1 mEq/kg IV ช้าๆ; ทารก/เด็กเล็กใช้ความเข้มข้น ≤ 4.2% (เจือจาง 7.5% 1:1 ด้วย SWI) ให้ช้าๆ"]],["การเตรียม/ผสม",["• IV push ในภาวะฉุกเฉินให้แบบไม่เจือจางได้","• Infusion: เจือจางใน D5W หรือ SWI เช่น 3 ขวด (≈ 134 mEq) + D5W ให้ได้ 1,000 mL (ใกล้ isotonic)","• ห้ามผสมกับ calcium (ตกตะกอน) และ catecholamine (ADREnaline, NORepinephrine, DOPamine, DOBUTamine) — flush สายด้วย NSS ก่อนและหลัง"]],["การบริหารยา",["ผ่าน infusion pump (ยกเว้น IV push ฉุกเฉิน); ใช้หลอดเลือดดำขนาดใหญ่; ต้องมีการระบายอากาศเพียงพอ (เกิด CO2 เพิ่ม)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: metabolic/respiratory alkalosis, hypocalcemia ที่ยังไม่แก้ไข, การสูญเสีย chloride (อาเจียน/ดูดน้ำย่อย); ระวัง: hypernatremia, ภาวะน้ำเกิน/หัวใจล้มเหลว, ไตวาย, extravasation (เนื้อเยื่อตาย)"]],["การติดตาม",["ABG/VBG, Na, K, ionized Ca ก่อนและหลังให้ยา (ทุก 2–4 ชม. ระหว่าง infusion); ECG (QRS) กรณีพิษยา; สัญญาณชีพ; IV site"]],["เกณฑ์แจ้งแพทย์",["pH > 7.55; Na > 150 mEq/L; K < 3.5 mEq/L; ชักเกร็ง/มือจีบ (ionized Ca ต่ำ); หายใจช้า/ซึม; IV site บวม แดง ปวด"]],["อาการไม่พึงประสงค์",["Metabolic alkalosis, hypernatremia, hypokalemia, hypocalcemia, ภาวะน้ำเกิน, CO2 คั่ง, extravasation"]],["การแก้ไข",["หยุดยา แก้ K/Ca ตามแพทย์สั่ง; extravasation: หยุดให้ยาทันที ยกส่วนนั้นสูง แจ้งแพทย์"]],["เอกสารอ้างอิง",["[7], [44], [45], [46]"]]]},"HAD-24":{"id":"HAD-24","title":"diazePAM INJ (10 mg/ 2 mL) 2 mL (Diapine®) (HAD)","rows":[["กลุ่มยา",["Benzodiazepine (moderate sedation agent, IV)"]],["ความแรง",["5 mg/mL; 1 amp (2 mL) = 10 mg"]],["ข้อบ่งใช้",["Status epilepticus/ชัก, sedation ก่อนหัตถการ, alcohol withdrawal, กล้ามเนื้อหดเกร็ง"]],["ขนาดยาผู้ใหญ่",["• Status epilepticus: 0.15–0.2 mg/kg IV (สูงสุด 10 mg/ครั้ง) ซ้ำได้ 1 ครั้งหลัง 5 นาที","• Sedation/anxiolysis: 2–10 mg IV ช้าๆ ปรับตามผล"]],["ขนาดยาเด็ก",["Status epilepticus: 0.15–0.2 mg/kg IV (สูงสุด 10 mg/ครั้ง) ซ้ำได้ 1 ครั้งหลัง 5 นาที"]],["การเตรียม/ผสม",["ให้แบบไม่เจือจาง (เจือจางแล้วตกตะกอน); ไม่ผสมรวมกับยาอื่นในกระบอกฉีดหรือสายเดียวกัน; ไม่แนะนำให้หยดต่อเนื่อง (ตกตะกอน/ดูดซับกับ PVC)"]],["การบริหารยา",["IV ช้า ผู้ใหญ่ ≤ 5 mg/นาที เด็กฉีดช้าอย่างน้อย 3 นาที ผ่านหลอดเลือดดำใหญ่; หลีกเลี่ยง IM (ดูดซึมไม่แน่นอน); เตรียมอุปกรณ์ช่วยหายใจให้พร้อม"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยา, myasthenia gravis, ภาวะหายใจล้มเหลวรุนแรง, sleep apnea, ต้อหินมุมปิดเฉียบพลัน; ระวัง: ผู้สูงอายุ ตับบกพร่อง ใช้ร่วม opioid"]],["การติดตาม",["RR, SpO2, BP, HR และ sedation score ทุก 5–15 นาทีหลังให้ยาจนครบ 1 ชม. แล้วทุก 1 ชม. จนตื่นดี; IV site"]],["เกณฑ์แจ้งแพทย์",["RR < 12, SpO2 < 94%, SBP < 90 mmHg, sedation score ≥ 2, ชักซ้ำหลังให้ยา"]],["อาการไม่พึงประสงค์",["กดการหายใจ, ความดันต่ำ, ง่วงซึม, หลอดเลือดดำอักเสบ, อาการกระวนกระวายแบบ paradoxical"]],["อันตรกิริยาสำคัญ",["Opioids, แอลกอฮอล์ และยากดระบบประสาทส่วนกลางอื่น เสริมฤทธิ์กดการหายใจ"]],["การแก้ไขภาวะกดการหายใจ",["หยุดยา เปิดทางเดินหายใจ ให้ออกซิเจนและช่วยหายใจ แจ้งแพทย์ทันที"]],["เอกสารอ้างอิง",["[47], [20], [1]"]]]},"HAD-25":{"id":"HAD-25","title":"BUPivacaine INJ (Marcaine Spinal 0.5% HEAVY) 5 mg/mL 4 mL (HAD)","rows":[["กลุ่มยา",["Local anesthetic, intrathecal (spinal)"]],["ความแรง",["0.5% = 5 mg/mL; 1 amp (4 mL) = 20 mg; ชนิด HEAVY (hyperbaric มี dextrose 80 mg/mL) การกระจายตัวในช่องไขสันหลังขึ้นกับท่าของผู้ป่วย; เป็นคนละรายการกับ BUPivacaine ISOBARIC (HAD-35) ห้ามใช้แทนกัน"]],["ข้อบ่งใช้",["Spinal anesthesia โดยวิสัญญีแพทย์เท่านั้น"]],["ขนาดยาผู้ใหญ่",["ตามวิสัญญีแพทย์ตามระดับการชาและชนิดการผ่าตัด โดยทั่วไป 7.5–15 mg (1.5–3 mL)"]],["ขนาดยาเด็ก",["ตามวิสัญญีแพทย์ คำนวณตามน้ำหนักตัว"]],["การบริหารยา",["ฉีดเข้าช่องไขสันหลัง (intrathecal) เท่านั้น ห้ามให้ทางหลอดเลือดดำ; ใช้ครั้งเดียวทิ้งส่วนที่เหลือ; อ่านฉลากให้ตรงชนิด (SPINAL HEAVY) และตรวจสอบซ้ำก่อนฉีด; เก็บแยกจาก BUPivacaine ISOBARIC, Tranexamic acid ชนิดฉีดและยาฉีดขนาดบรรจุใกล้เคียง (การฉีดยาผิดเข้าไขสันหลังทำให้เสียชีวิตได้)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยาชากลุ่ม amide, ติดเชื้อบริเวณที่ฉีด, ภาวะเลือดออกง่าย, ความดันในกะโหลกสูง, ภาวะขาดน้ำรุนแรง; ระวัง: ผู้ป่วยได้ยาต้านการแข็งตัวของเลือด (เว้นระยะตามแนวทาง ASRA)"]],["การติดตาม",["BP/HR ทุก 2–5 นาที ใน 20 นาทีแรก แล้วทุก 15 นาทีจนสิ้นสุดการผ่าตัดและออกจากห้องพักฟื้น; ระดับการชา; การหายใจ; การฟื้นตัวของการเคลื่อนไหวขา; การปัสสาวะ"]],["เกณฑ์แจ้งแพทย์",["SBP < 90 mmHg หรือลดลง > 20% จากเดิม, HR < 50, หายใจลำบาก/แขนชา (high spinal), ขาไม่ฟื้นตัวเกินเวลาที่คาด หรือปวดหลังรุนแรง (สงสัย spinal hematoma)"]],["อาการไม ing agent – causes respiratory arrest; infusion ผ่าน pump"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยา; ระวัง: ตับบกพร่อง (ฤทธิ์นาน), myasthenia gravis, ใช้ร่วม aminoglycoside/magnesium (เสริมฤทธิ์)"]],["การติดตาม",["TOF (หน่วยวิกฤต เป้าหมาย 1–2/4), ventilator/RR, SpO2, HR/BP, ระดับความลึกของการกดประสาท; การดูแลตาและการพลิกตัว"]],["เกณฑ์แจ้งแพทย์",["หายใจเองไม่ได้หลังหยุดยาเกินเวลาที่คาด, TOF 0/4 นาน, อาการแพ้ (ผื่น ความดันต่ำ หลอดลมตีบ)"]],["อาการไม่พึงประสงค์",["Anaphylaxis, อัมพาตนานกว่าที่คาด, กล้ามเนื้ออ่อนแรงจากการนอนหน่วยวิกฤตนาน"]],["ยาต้านฤทธิ์",["Neostigmine ร่วมกับ ATROPine เมื่อเริ่มฟื้นตัว (TOF ≥ 2/4) ตามแพทย์สั่ง"]],["เอกสารอ้างอิง",["[15], [54], [50]"]]]},"HAD-30":{"id":"HAD-30","title":"Suxamethonium (Succinylcholine) INJ 50 mg/mL 10 mL (PINYO) (HAD)","rows":[["กลุ่มยา",["Neuromuscular blocking agent (depolarizing)"]],["ความแรง",["50 mg/mL; 1 vial (10 mL) = 500 mg"]],["ข้อบ่งใช้",["Rapid sequence intubation, การรักษาด้วยไฟฟ้า (ECT), laryngospasm"]],["ขนาดยาผู้ใหญ่",["IV 1–1.5 mg/kg (โดยทั่วไปไม่เกิน 150 mg); IM 3–4 mg/kg (ไม่เกิน 150 mg) เมื่อไม่มีเส้นเลือด"]],["ขนาดยาเด็ก",["ทารก 2 mg/kg IV; เด็ก 1–2 mg/kg IV (พิจารณา ATROPine ก่อนเพื่อป้องกันหัวใจเต้นช้า)"]],["การเก็บรักษา",["ตู้เย็น 2–8 °C; ที่อุณหภูมิห้องใช้ได้ตามระยะเวลาที่ผู้ผลิตกำหนด (ระบุวันที่นำออก)"]],["การบริหารยา",["ใช้โดยผู้ที่ดูแลทางเดินหายใจได้ พร้อมเครื่องช่วยหายใจ; ให้ยานอนหลับก่อน; ติดฉลาก Warning: paralyzing agent; ห้ามผสมกับ thiopental"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: ประวัติ (ตนเอง/ครอบครัว) malignant hyperthermia; เสี่ยงโพแทสเซียมสูง (แผลไหม้หรือบาดเจ็บรุนแรงหลัง 48–72 ชม., อัมพาต/โรคเส้นประสาทและกล้ามเนื้อ เช่น Duchenne, นอนนิ่งนาน, K สูงอยู่เดิม); ระวัง: ภาวะพร่องเอนไซม์ pseudocholinesterase, ความดันในตา/กะโหลกสูง"]],["การติดตาม",["HR/ECG (หัวใจเต้นช้า โดยเฉพาะเด็กหรือให้ซ้ำ), SpO2, EtCO2 และอุณหภูมิกาย (malignant hyperthermia), K ในผู้ป่วยเสี่ยง"]],["เกณฑ์แจ้งแพทย์",["EtCO2 สูงขึ้นเร็ว/กล้ามเนื้อกรามแข็ง/ไข้สูงขึ้น (MH), หัวใจเต้นผิดจังหวะหรือ T wave สูง (K สูง), หยุด กสารอ้างอิง",["[56], [48], [1]"]]]},"HAD-32":{"id":"HAD-32","title":"ROPivacaine inj ** NO IV: 10 mg/ml (10 mL) [SP] (HAD)","rows":[["กลุ่มยา",["Local anesthetic (epidural / nerve block / infiltration)"]],["ความแรง",["1% = 10 mg/mL; 1 amp (10 mL) = 100 mg; ฉลากผู้ผลิตระบุ NO IV"]],["ข้อบ่งใช้",["Epidural anesthesia/analgesia (รวมระงับปวดหลังผ่าตัดและระหว่างคลอด), peripheral nerve block, ยาชาเฉพาะที่ (infiltration) โดยแพทย์"]],["ขนาดยาผู้ใหญ่",["• Epidural ผ่าตัด: 0.75–1% ตามวิสัญญีแพทย์","• Nerve block: 0.5–0.75% ตามชนิดของ block","• Epidural infusion หลังผ่าตัด: 0.2% (2 mg/mL) 6–14 mL/hr","• ขนาดสูงสุดครั้งเดียวโดยทั่วไปไม่เกิน 3 mg/kg (ไม่เกิน 300 mg) และรวมใน 24 ชม. ไม่เกิน 770 mg"]],["ขนาดยาเด็ก",["ตามวิสัญญีแพทย์ คำนวณตามน้ำหนักตัว"]],["การเตรียม/ผสม",["• เจือจางเป็น 0.2% ด้วย NSS: ยา 1 ส่วน + NSS 4 ส่วน (เช่น 1% 20 mL + NSS 80 mL = 100 mL)","• ไม่มีสารกันเสีย ใช้ภายใน 24 ชม.หลังเตรียม; ติดฉลาก \"EPIDURAL – ห้ามให้ทางหลอดเลือดดำ\""]],["การบริหารยา",["ทาง epidural/perineural/infiltration เท่านั้น ห้ามให้ทางหลอดเลือดดำ; ดูดทดสอบ (aspirate) ก่อนฉีด ให้ทีละน้อย; epidural infusion ใช้ pump และสายเฉพาะ แยกจากสายให้ยาทางหลอดเลือดดำ; เตรียม 20% lipid emulsion และอุปกรณ์กู้ชีพให้พร้อม"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยาชากลุ่ม amide, IV regional anesthesia (Bier block); ระวัง: ภาวะขาดน้ำ ตับบกพร่อง ผู้สูงอายุ ยาต้านการแข็งตัวของเลือด (เว้นระยะตามแนวทาง ASRA)"]],["การติดตาม",["BP, HR, SpO2 และอาการพิษยาชาอย่างน้อย 30 นาทีหลังฉีด; epidural infusion: BP/HR/RR/sedation score/ระดับการชา/การเคลื่อนไหวขา ทุก 1 ชม."]],["เกณฑ์แจ้งแพทย์",["ชารอบปาก ลิ้นรับรสโลหะ หูอื้อ สับสน ชัก หัวใจเต้นผิดจังหวะ (LAST); SBP < 90 mmHg; RR < 12; ขาอ่อนแรงมากขึ้นหรือปวดหลังรุนแรง"]],["อาการไม่พึงประสงค์",["ความดันต่ำ, หัวใจเต้นช้า, คลื่นไส้, พิษยาชาต่อระบบประสาทและหัวใจ (LAST)"]],["การแก้ไข (LAST)",["หยุดให้ยา ดูแลทางเดินหายใจ ควบคุมชักด้วย benzodiazepine; 20% lipid emulsion ตาม HAD-31"]],["เอกสารอ้างอิง",["[48], [49], [50], [1]"]]]},"HAD-33":{"id":"HAD-33","title":"***Sodium Chloride Solution 3% - INJ 500 mL (GHP)*** [SP] (HAD)","rows":[["กลุ่มยา",["Hypertonic sodium chloride (> 0.9%)"]],["ความแรง",["3% = 513 mEq/L (0.513 mEq/mL); 500 mL = 256 mEq Na; osmolarity ประมาณ 1,027 mOsm/L"]],["ข้อบ่งใช้",["ภาวะโซเดียมในเลือดต่ำที่มีอาการรุนแรงหรือปานกลาง; ภาวะความดันในกะโหลกศีรษะสูงตามแพทย์สั่ง"]],["ขนาดยาผู้ใหญ่",["• Hyponatremia รุนแรง: 150 mL IV ใน 20 นาที ตรวจ Na ซ้ำ ให้ซ้ำได้ 2–3 ครั้งจน Na เพิ่มขึ้น 5 mmol/L หรืออาการดีขึ้น; หยุดเมื่ออาการดีขึ้น หรือ Na เพิ่มรวม 10 mmol/L หรือ Na ถึง 130 mmol/L แล้วแต่อย่างใดถึงก่อน","• การให้แบบ bolus เป็นช่วง (rapid intermittent bolus) เสี่ยงแก้ Na เร็วเกินไม่ต่างจากการหยดต่อเนื่อง และต้องแก้ไขการรักษาซ้ำน้อยกว่า","• จำกัดการเพิ่มของ Na ไม่เกิน 10 mmol/L ใน 24 ชม.แรก และไม่เกิน 8 mmol/L ในแต่ละ 24 ชม.ถัดไป (ป้องกัน osmotic demyelination)"]],["ขนาดยาเด็ก",["Hyponatremia รุนแรง: 2 mL/kg (สูงสุด 100 mL) IV ใน 10–20 นาที ตามแพทย์สั่ง"]],["การเตรียม/ผสม",["ใช้ได้ทันทีไม่ต้องเจือจาง; ห้ามเติมยาอื่นลงในขวด"]],["การบริหารยา",["ผ่าน infusion pump ทุกครั้ง; การให้ต่อเนื่องควรใช้หลอดเลือดดำใหญ่; เก็บแยกจาก NSS 0.9% และติดฉลาก \"3% HYPERTONIC\""]],["ข้อห้ามใช้/ข้อควรระวัง",["ระวัง: หัวใจล้มเหลว ภาวะน้ำเกิน ไตวาย; hyponatremia เรื้อรังเสี่ยง osmotic demyelination เมื่อแก้เร็วเกิน"]],["การติดตาม",["Na หลังให้ bolus 20 นาที แล้วทุก 2–4 ชม. ระหว่างการรักษา; ระดับความรู้สึกตัว; ปริมาณน้ำเข้า-ออก; สัญญาณชีพ; ภาวะน้ำเกิน"]],["เกณฑ์แจ้งแพทย์",["Na เพิ่ม ≥ 8–10 mmol/L ใน 24 ชม., Na > 145 mmol/L, ปัสสาวะออกมากผิดปกติ (เสี่ยงแก้เร็วเกิน), หอบเหนื่อย/บวม, ความรู้สึกตัวเปลี่ยนแปลง"]],["อาการไม่พึงประสงค์",["Na แก้เร็วเกิน (osmotic demyelination), ภาวะน้ำเกิน, hypernatremia, hyperchloremic acidosis, หลอดเลือดดำอักเสบ"]],["การแก้ไข",["หยุดยาเมื่อ Na เพิ่มถึงเกณฑ์ แจ้งแพทย์; หาก Na เพิ่มเร็วเกินให้แพทย์พิจารณาให้น้ำปราศจากโซเดียม (D5W) และ/หรือ desmopressin"]],["เอกสารอ้างอิง",["[57], [58], [59], [60], [1], [61]"]]]},"HAD-34":{"id":"HAD-34","title":"Sterile Water for Injection (SWI) INJ 1,000 mL (Thaiotsuka) (HAD)","rows":[["กลุ่มยา",["Sterile water for injection ≥ 100 mL (hypotonic)"]],["ลักษณะ",["น้ำปราศจากเชื้อ ไม่มีอิเล็กโทรไลต์ (hypotonic, 0 mOsm/L) ขวด 1,000 mL"]],["ข้อบ่งใช้",["ใช้เป็นสารละลายสำหรับละลายหรือเจือจางยาในการเตรียมยาเท่านั้น"]],["การบริหารยา",["ห้ามให้ทางหลอดเลือดดำโดยตรงเด็ดขาด (ทำให้เม็ดเลือดแดงแตก ไตวาย); ห้ามต่อชุดให้สารน้ำเข้ากับขวดนี้"]],["การเก็บรักษา",["เก็บแยกจากสารน้ำที่ให้ทางหลอดเลือดดำ ติดฉลาก \"ห้ามให้ทางหลอดเลือดดำโดยตรง – ใช้ละลาย/เจือจางยาเท่านั้น\"; ไม่สำรองในหอผู้ป่วย (ข้อ 2.3.2)"]],["การจ่ายยา",["จ่ายเฉพาะเพื่อการเตรียมยาตามคำสั่ง ตรวจสอบซ้ำโดยอิสระก่อนจ่าย"]],["เมื่อให้ผิดทางหลอดเลือดดำ",["หยุดทันที แจ้งแพทย์ ตรวจ electrolytes ตามแพทย์สั่ง; ติดตามอาการเจ็บบริเวณที่ให้สารน้ำ แน่นหน้าอก หายใจลำบาก ปัสสาวะสีเข้ม ปัสสาวะออกน้อย ซึมหรือสับสน และบันทึกในแบบเฝ้าระวัง HAD-34"]],["เอกสารอ้างอิง",["[1], [72], [73], [74], [75]"]]]},"HAD-35":{"id":"HAD-35","title":"BUPivacaine ISOBARIC INJ (ISO Spinal MARCAINE 0.5%) 5 mg/mL 4 mL (HAD)","rows":[["กลุ่มยา",["Local anesthetic, intrathecal (spinal)"]],["ความแรง",["0.5% = 5 mg/mL; 1 amp (4 mL) = 20 mg; ชนิด ISOBARIC (ไม่มี dextrose) การกระจายตัวขึ้นกับท่าของผู้ป่วยน้อยกว่าชนิด HEAVY; เป็นคนละรายการกับ BUPivacaine HEAVY (HAD-25) ห้ามใช้แทนกัน"]],["ข้อบ่งใช้",["Spinal anesthesia โดยวิสัญญีแพทย์เท่านั้น"]],["ขนาดยาผู้ใหญ่",["ตามวิสัญญีแพทย์ตามระดับการชาและชนิดการผ่าตัด โดยทั่วไป 10–20 mg (2–4 mL)"]],["ขนาดยาเด็ก",["ตามวิสัญญีแพทย์ คำนวณตามน้ำหนักตัว"]],["การบริหารยา",["ฉีดเข้าช่องไขสันหลัง (intrathecal) เท่านั้น ห้ามให้ทางหลอดเลือดดำ; ใช้ครั้งเดียวทิ้งส่วนที่เหลือ; อ่านฉลากให้ตรงชนิด (SPINAL ISOBARIC) และตรวจสอบซ้ำก่อนฉีด; เก็บแยกจาก BUPivacaine HEAVY, Tranexamic acid ชนิดฉีดและยาฉีดขนาดบรรจุใกล้เคียง (การฉีดยาผิดเข้าไขสันหลังทำให้เสียชีวิตได้)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยาชากลุ่ม amide, ติดเชื้อบริเวณที่ฉีด, ภาวะเลือดออกง่าย, ความดันในกะโหลกสูง, ภาวะขาดน้ำรุนแรง; ระวัง: ผู้ป่วยได้ยาต้านการแข็งตัวของเลือด (เว้นระยะตามแนวทาง ASRA)"]],["การติดตาม",["BP/HR ทุก 2–5 นาที ใน 20 นาทีแรก แล้วทุก 15 นาทีจนสิ้นสุดการผ่าตัดและออกจากห้องพักฟื้น; ระดับการชา; การหายใจ; การฟื้นตัวของการเคลื่อนไหวขา; การปัสสาวะ"]],["เกณฑ์แจ้งแพทย์",["SBP < 90 mmHg หรือลดลง > 20% จากเดิม, HR < 50, หายใจลำบาก/แขนชา (high spinal), ขาไม่ฟื้นตัวเกินเวลาที่คาด หรือปวดหลังรุนแรง (สงสัย spinal hematoma)"]],["อาการไม่พึงประสงค์",["ความดันต่ำ, หัวใจเต้นช้า, คลื่นไส้อาเจียน, high/total spinal, ปวดศีรษะหลังเจาะหลัง, ปัสสาวะคั่ง, พิษยาชา (พบน้อย)"]],["การแก้ไข",["ความดันต่ำ: IV fluid และยาเพิ่มความดันตามแพทย์; พิษยาชาต่อระบบ (LAST): 20% lipid emulsion ตาม HAD-31"]],["เอกสารอ้างอิง",["[48], [49], [50], [1]"]]]},"HAD-36":{"id":"HAD-36","title":"Desflurane RESP 100 mg/100 mL 240 mL (Suprane®) (HAD)","rows":[["กลุ่มยา",["Anesthetic agent, general (inhaled, volatile)"]],["ความแรง",["ของเหลวระเหยง่าย desflurane 100% ขวด 240 mL; จุดเดือด 22.8 °C จึงต้องใช้ vaporizer ชนิดให้ความร้อนและความดันที่ออกแบบเฉพาะ desflurane; MAC ผู้ใหญ่ประมาณ 6% (อายุ 45 ปี) ลดลงตามอายุ"]],["ข้อบ่งใช้",["นำสลบและคงการสลบในผู้ใหญ่; คงการสลบในเด็กที่ใส่ท่อช่วยหายใจแล้ว โดยวิสัญญีแพทย์หรือวิสัญญีพยาบาลเท่านั้น"]],["ขนาดยาผู้ใหญ่",["ปรับตามความลึกของการสลบโดยวิสัญญีแพทย์; คงการสลบโดยทั่วไป 2.5–8.5% (ร่วมกับ N2O หรือไม่ก็ได้)"]],["ขนาดยาเด็ก",["คงการสลบในเด็กที่ใส่ท่อช่วยหายใจแล้ว โดยทั่วไป 5.2–10% ตามวิสัญญีแพทย์; ห้ามใช้นำสลบด้วยหน้ากากในเด็ก"]],["การบริหารยา",["ทางการหายใจผ่าน vaporizer เฉพาะ desflurane เท่านั้น เติมยาด้วยระบบเติมเฉพาะ (keyed filler) ห้ามเทเติม; เพิ่มความเข้มข้นทีละน้อย (การเพิ่มเร็วกระตุ้นหัวใจเต้นเร็วและความดันสูงชั่วคราว); ใช้ CO2 absorbent ที่ไม่แห้ง (absorbent แห้งทำให้เกิด carbon monoxide)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: ผู้ที่มีหรือสงสัยว่ามีความไวต่อ malignant hyperthermia, แพ้ยาดมสลบกลุ่ม halogenated, ประวัติตับอักเสบหรือดีซ่านหลังได้ยาดมสลบกลุ่ม halogenated, นำสลบด้วยหน้ากากในเด็ก; ระวัง: โรคหลอดเลือดหัวใจ, ทางเดินหายใจไวเกินหรือหอบหืด, ความดันในกะโหลกศีรษะสูง, โรคกล้ามเนื้อ (เสี่ยงโพแทสเซียมสูง), QT ยาว"]],["การติดตาม",["ระหว่างให้ยา: ความเข้มข้นของยาในลมหายใจออก (end-tidal agent), EtCO2, SpO2, BP, HR/ECG และอุณหภูมิกาย ต่อเนื่อง; ห้องพักฟื้น: ระดับความรู้สึกตัว การหายใจ SpO2 และคลื่นไส้อาเจียน"]],["เกณฑ์แจ้งแพทย์",["EtCO2 สูงขึ้นโดยอธิบายไม่ได้ หัวใจเต้นเร็ว กล้ามเนื้อแข็งเกร็ง (รวม masseter spasm) หรืออุณหภูมิกายสูงขึ้นเร็ว (สงสัย malignant hyperthermia); laryngospasm/bronchospasm; ความดันต่ำหรือหัวใจเต้นผิดจังหวะ"]],["อาการไม่พึงประสงค์",["ไอ กลั้นหายใจ laryngospasm (โดยเฉพาะเด็ก), หัวใจเต้นเร็วและความดันสูงชั่วคราว, ความดันต่ำ, คลื่นไส้อาเจียนหลังผ่าตัด, malignant hyperthermia, โพแทสเซียมสูง (ผู้ป่วยโรคกล้ามเนื้อ), ตับอักเสบ (พบน้อย)"]],["การแก้ไข",["Malignant hyperthermia: หยุดยาดมสลบทันที ขอความช่วยเหลือ ให้ O2 100% อัตราไหลสูงและเพิ่มการหายใจ; Dantrolene 2.5 mg/kg IV ให้ซ้ำได้จนอาการดีขึ้นตามวิสัญญีแพทย์; ลดอุณหภูมิกาย; โพแทสเซียมสูง: ตาม HAD-03/19/22"]],["การเก็บรักษา",["เก็บที่ 15–30 °C ปิดฝาแน่น; สำรองเป็น floor stock ควบคุมของห้องผ่าตัดตามข้อ 2.3.6 แยกจากยาดมสลบชนิดอื่น และติดป้าย HAD"]],["แบบเฝ้าระวัง",["ไม่มีแบบฟอร์มแยก บันทึกในใบบันทึกการให้ยาระงับความรู้สึก (anesthetic record) เลขที่เอกสาร MSO-0112-MR-P-00-052025"]],["เอกสารอ้างอิง",["[68], [70], [50], [1]"]]]},"HAD-37":{"id":"HAD-37","title":"Sevoflurane 100 mg/100 mL 250 mL (Sojourn®) (HAD)","rows":[["กลุ่มยา",["Anesthetic agent, general (inhaled, volatile)"]],["ความแรง",["ของเหลวระเหยง่าย sevoflurane 100% ขวด 250 mL; MAC ผู้ใหญ่ประมาณ 2% (อายุ 40 ปี) ลดลงตามอายุ เด็กสูงกว่าผู้ใหญ่"]],["ข้อบ่งใช้",["นำสลบและคงการสลบทั้งผู้ใหญ่และเด็ก (นำสลบด้วยหน้ากากได้ เพราะไม่ระคายทางเดินหายใจ) โดยวิสัญญีแพทย์หรือวิสัญญีพยาบาลเท่านั้น"]],["ขนาดยาผู้ใหญ่",["• นำสลบ: นำสลบด้วยหน้ากากได้ ปรับความเข้มข้นตามวิสัญญีแพทย์","• คงการสลบ: 0.5–3% (ร่วมกับ N2O หรือไม่ก็ได้) ตามวิสัญญีแพทย์"]],["ขนาดยาเด็ก",["• นำสลบ: นำสลบด้วยหน้ากากได้ ปรับความเข้มข้นตามวิสัญญีแพทย์","• คงการสลบ: ตามวิสัญญีแพทย์"]],["การบริหารยา",["ทางการหายใจผ่าน vaporizer เฉพาะ sevoflurane เท่านั้น เติมยาด้วยระบบเติมเฉพาะ (keyed filler); fresh gas flow ไม่ต่ำกว่า 1 L/min โดยที่ 1 L/min ไม่เกิน 2 MAC-hour หากนานกว่านั้นใช้ ≥ 2 L/min (ลด compound A); ห้ามใช้กับ CO2 absorbent ที่แห้ง (เกิดความร้อนสูง ไฟลุก และ carbon monoxide)"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: ผู้ที่มีหรือสงสัยว่ามีความไวต่อ malignant hyperthermia, แพ้ยาดมสลบกลุ่ม halogenated; ระวัง: ไตบกพร่อง, ความดันในกะโหลกศีรษะสูง, QT ยาว, โรคกล้ามเนื้อ (เสี่ยงโพแทสเซียมสูง), ประวัติชัก (มีรายงานชักโดยเฉพาะในเด็ก)"]],["การติดตาม",["ระหว่างให้ยา: ความเข้มข้นของยาในลมหายใจออก (end-tidal agent), EtCO2, SpO2, BP, HR/ECG และอุณหภูมิกาย ต่อเนื่อง; ห้องพักฟื้น: ระดับความรู้สึกตัว การหายใจ SpO2 และคลื่นไส้อาเจียน"]],["เกณฑ์แจ้งแพทย์",["EtCO2 สูงขึ้นโดยอธิบายไม่ได้ หัวใจเต้นเร็ว กล้ามเนื้อแข็งเกร็ง (รวม masseter spasm) หรืออุณหภูมิกายสูงขึ้นเร็ว (สงสัย malignant hyperthermia); laryngospasm/bronchospasm; ความดันต่ำหรือหัวใจเต้นผิดจังหวะ; ชัก หรือกระสับกระส่ายรุนแรงขณะฟื้นจากยาสลบ"]],["อาการไม่พึงประสงค์",["ความดันต่ำ, หัวใจเต้นช้า, คลื่นไส้อาเจียน, กระสับกระส่ายขณะฟื้นจากยาสลบ (emergence delirium โดยเฉพาะเด็ก), ไอ, ชัก (พบน้อย), QT ยาว, malignant hyperthermia, โพแทสเซียมสูง (ผู้ป่วยโรคกล้ามเนื้อ)"]],["การแก้ไข",["Malignant hyperthermia: หยุดยาดมสลบทันที ขอความช่วยเหลือ ให้ O2 100% อัตราไหลสูงและเพิ่มการหายใจ; Dantrolene 2.5 mg/kg IV ให้ซ้ำได้จนอาการดีขึ้นตามวิสัญญีแพทย์; ลดอุณหภูมิกาย; โพแทสเซียมสูง: ตาม HAD-03/19/22"]],["การเก็บรักษา",["เก็บที่ 20–25 °C (อนุโลม 15–30 °C) ปิดฝาแน่น; สำรองเป็น floor stock ควบคุมของห้องผ่าตัดตามข้อ 2.3.6 แยกจากยาดมสลบชนิดอื่น และติดป้าย HAD"]],["แบบเฝ้าระวัง",["ไม่มีแบบฟอร์มแยก บันทึกในใบบันทึกการให้ยาระงับความรู้สึก (anesthetic record) เลขที่เอกสาร MSO-0112-MR-P-00-052025"]],["เอกสารอ้างอิง",["[69], [70], [50], [1]"]]]},"HAD-38":{"id":"HAD-38","title":"ePHEDrine INJ (30 mg/mL) 1 mL (GPO®) (HAD)","rows":[["กลุ่มยา",["Adrenergic agonist, IV (vasopressor)"]],["ความแรง",["30 mg/mL; 1 amp (1 mL) = 30 mg"]],["ข้อบ่งใช้",["ภาวะความดันโลหิตต่ำที่มีนัยสำคัญทางคลินิกระหว่างการระงับความรู้สึก [76]"]],["ขนาดยาผู้ใหญ่",["5–10 mg IV bolus ให้ซ้ำได้ตามต้องการ ปรับตามเป้าหมายความดันโลหิต รวมไม่เกิน 50 mg [76], [77]"]],["ขนาดยาเด็ก",["เอกสารกำกับยาระบุว่ายังไม่มีข้อมูลความปลอดภัยและประสิทธิภาพในเด็ก [76] ใช้ตามวิสัญญีแพทย์"]],["การเตรียม/ผสม",["เจือจางเป็น 5 mg/mL ด้วย NSS หรือ D5W [77] (ยาของโรงพยาบาล 30 mg/1 mL + สารละลาย 5 mL = 6 mL) ติดฉลากชื่อยาและความเข้มข้นที่กระบอกยา"]],["การบริหารยา",["IV bolus; ชื่อพ้องกับ ADREnaline [EPINEPHrine] (HAD-01) ใช้ชื่อแบบ Tall Man (ePHEDrine) และตรวจชื่อยาก่อนเตรียมทุกครั้ง"]],["ข้อห้ามใช้/ข้อควรระวัง",["เอกสารกำกับยาไม่ระบุข้อห้ามใช้; ระวัง: ใช้ร่วมกับยากลุ่ม oxytocic (มีรายงานความดันสูงรุนแรงหลังคลอดและโรคหลอดเลือดสมอง); MAOI, clonidine, propofol และ atropine เพิ่มฤทธิ์เพิ่มความดัน; alpha- และ beta-blocker ลดฤทธิ์; ให้ซ้ำหลายครั้งได้ผลลดลง (tachyphylaxis); การให้เพื่อป้องกันความดันต่ำสัมพันธ์กับความดันสูงมากกว่าการให้เพื่อรักษา [76]"]],["การติดตาม",["ECG ต่อเนื่อง และ BP/HR อย่างน้อยทุก 5 นาทีระหว่างการระงับความรู้สึก [78]; ติดตาม BP ใกล้ชิดเมื่อใช้ร่วมกับยาที่มีปฏิกิริยาต่อกัน [76]"]],["เกณฑ์แจ้งแพทย์",["ความดันสูงขึ้นมาก, หัวใจเต้นเร็วหรือช้า, ใจสั่น, ให้ครบ 50 mg แล้วความดันยังไม่ตอบสนอง [76]"]],["อาการไม่พึงประสงค์",["พบบ่อย: คลื่นไส้ อาเจียน หัวใจเต้นเร็ว; อื่น ๆ: ใจสั่น ความดันสูงตามมา (reactive hypertension) หัวใจเต้นช้า เวียนศีรษะ [76]"]],["การแก้ไข",["ได้รับเกินขนาด: ติดตาม BP ใกล้ชิด แพทย์พิจารณาให้ยาลดความดันชนิดฉีด [76]"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-38 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[76], [77], [78], [1]"]]]},"HAD-39":{"id":"HAD-39","title":"adeNOSINE INJ (3 mg/ml) 1 mL (Tachyban-PINYO) (HAD)","rows":[["กลุ่มยา",["Antiarrhythmic, IV"]],["ความแรง",["3 mg/mL; 1 amp (1 mL) = 3 mg (ขนาด 6 mg ใช้ 2 amp และ 12 mg ใช้ 4 amp)"]],["ข้อบ่งใช้",["แปลง paroxysmal supraventricular tachycardia (PSVT) รวมที่มี accessory pathway (WPW) กลับเป็น sinus rhythm; ไม่ได้ผลกับ atrial flutter, atrial fibrillation และ ventricular tachycardia [79]"]],["ขนาดยาผู้ใหญ่",["• 6 mg rapid IV bolus ใน 1–2 วินาที ตามด้วย NSS flush ทันที","• หากไม่หายใน 1–2 นาที ให้ 12 mg rapid IV bolus และให้ 12 mg ซ้ำได้อีก 1 ครั้ง; ไม่แนะนำขนาดเกิน 12 mg [79]"]],["ขนาดยาเด็ก",["น้ำหนัก < 50 kg: เริ่ม 0.05–0.1 mg/kg rapid IV bolus ตามด้วย NSS flush; หากไม่หายใน 1–2 นาที เพิ่มครั้งละ 0.05–0.1 mg/kg สูงสุด 0.3 mg/kg ต่อครั้ง; น้ำหนัก ≥ 50 kg ใช้ขนาดผู้ใหญ่ [79]"]],["การบริหารยา",["ฉีดเข้าหลอดเลือดดำโดยตรง หรือเข้าสายให้สารน้ำที่ใกล้ตัวผู้ป่วยที่สุด แล้ว flush ด้วย NSS ทันที; เตรียมอุปกรณ์และยากู้ชีพให้พร้อม [79]; ตรวจสอบจำนวน amp ให้ตรงกับขนาดยาที่สั่งก่อนให้ยาทุกครั้ง"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: AV block ระดับ 2–3, sick sinus syndrome หรือหัวใจเต้นช้าที่มีอาการ (ยกเว้นมีเครื่องกระตุ้นหัวใจที่ทำงานได้), แพ้ยา; ระวัง: หลีกเลี่ยงในผู้ป่วยหอบหืด (หลอดลมหดเกร็ง); methylxanthines (theophylline, caffeine) ลดฤทธิ์ อาจต้องใช้ขนาดสูงขึ้น; dipyridamole เพิ่มฤทธิ์ อาจใช้ขนาดต่ำลงได้; carbamazepine อาจเพิ่ม heart block; มีรายงาน ventricular fibrillation (พบน้อย) ส่วนใหญ่เมื่อใช้ร่วมกับ digoxin [79]"]],["การติดตาม",["ติดตามจังหวะหัวใจระหว่างและหลังให้ยา เพื่อเฝ้าระวัง heart block, asystole และจังหวะใหม่หลังแปลง เช่น AF [79]"]],["เกณฑ์แจ้งแพทย์",["heart block หรือ asystole, AF/VF หรือจังหวะผิดปกติใหม่, หลอดลมหดเกร็งหรือหายใจลำบาก, ชัก [79]"]],["อาการไม่พึงประสงค์",["หน้าแดง (18%), หายใจลำบาก (12%), แน่นหน้าอก (7%), คลื่นไส้ (3%), ปวดศีรษะ, มึนศีรษะ, ความดันต่ำ (< 1%); heart block ชั่วคราว, asystole, จังหวะใหม่หลังแปลง (AF), ชัก (รายงานหลังวางตลาด) [79]"]],["การแก้ไข",["เริ่มการรักษาตามความจำเป็นเมื่อเกิด heart block หรือ asystole [79]; หัวใจหยุดเต้นให้ช่วยชีวิตตามแนวทาง [7]"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-39 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[79], [7], [1]"]]]},"HAD-40":{"id":"HAD-40","title":"glipiZIDE TAB 5 mg **[SP] Minidiab (HAD)","rows":[["กลุ่มยา",["Sulfonylurea hypoglycemic, oral"]],["ความแรง",["5 mg ต่อเม็ด (ชนิดออกฤทธิ์ทันที)"]],["ข้อบ่งใช้",["เบาหวานชนิดที่ 2"]],["ขนาดยาผู้ใหญ่",["• เริ่ม 5 mg วันละครั้ง ก่อนอาหารเช้าประมาณ 30 นาที; ผู้สูงอายุหรือโรคตับ เริ่ม 2.5 mg [80]","• ปรับครั้งละ 2.5–5 mg ห่างกันหลายวัน; ขนาดเกิน 15 mg/วันโดยทั่วไปแบ่งให้; สูงสุด 40 mg/วัน [80]"]],["ขนาดยาเด็ก",["ไม่มีข้อบ่งใช้ในเด็ก"]],["การบริหารยา",["รับประทานก่อนอาหารประมาณ 30 นาที [80]; ผู้ป่วยในส่วนใหญ่ insulin เป็นการรักษาที่แนะนำ โดยเฉพาะผู้ที่รับประทานอาหารได้น้อยหรืองดอาหาร [37]; งดยาเบาหวานชนิดรับประทานในวันผ่าตัดหรือวันทำหัตถการ [37]"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ยา, เบาหวานชนิดที่ 1, diabetic ketoacidosis [80]; ระวัง: ผู้สูงอายุ ร่างกายอ่อนแอหรือขาดอาหาร, ต่อมหมวกไตหรือต่อมใต้สมองทำงานบกพร่อง, รับประทานอาหารน้อย ออกกำลังกายหนัก ดื่มสุรา; ยาที่เพิ่มฤทธิ์ลดน้ำตาล เช่น NSAIDs, fluconazole, miconazole; beta-blocker อาจบดบังอาการน้ำตาลต่ำ; ภาวะเครียด เช่น ไข้ ติดเชื้อ บาดเจ็บ หรือผ่าตัด อาจคุมน้ำตาลไม่ได้และต้องใช้ insulin [80]"]],["การติดตาม",["ผู้ป่วยใน: เจาะน้ำตาลปลายนิ้วก่อนอาหาร หรือทุก 4–6 ชม. หากไม่ได้รับประทานอาหาร [37]; อาการน้ำตาลต่ำ; การรับประทานอาหาร"]],["เกณฑ์แจ้งแพทย์",["ระดับน้ำตาล < 70 mg/dL หรือมีอาการน้ำตาลต่ำ [37]; รับประทานอาหารไม่ได้หรืองดน้ำงดอาหาร"]],["อาการไม่พึงประสงค์",["น้ำตาลในเลือดต่ำ"]],["การแก้ไข",["รู้สึกตัวและกลืนได้: คาร์โบไฮเดรตออกฤทธิ์เร็ว 15 g; กลืนไม่ได้หรืองดอาหาร: glucose ทางหลอดเลือดดำ (HAD-22) หรือ glucagon; ตรวจน้ำตาลทุก 15 นาทีและให้การรักษาซ้ำจนแก้ไขได้ [37]; น้ำตาลต่ำรุนแรงหรือได้รับเกินขนาด เฝ้าระวังใกล้ชิดอย่างน้อย 24–48 ชม. เพราะอาจเกิดซ้ำหลังดูเหมือนหายแล้ว [80]"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-40 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[80], [37], [1]"]]]},"HAD-41":{"id":"HAD-41","title":"gliCLAZIDE MR (diaMICRON MR) TAB 60 mg**[SP] (HAD)","rows":[["กลุ่มยา",["Sulfonylurea hypoglycemic, oral"]],["ความแรง",["60 mg ต่อเม็ด ชนิดออกฤทธิ์นาน (modified release) มีรอยแบ่ง แบ่งครึ่งเม็ดได้ [81]"]],["ข้อบ่งใช้",["เบาหวานชนิดที่ 2"]],["ขนาดยาผู้ใหญ่",["• เริ่ม 30 mg วันละครั้งพร้อมอาหารเช้า รวมถึงผู้สูงอายุ; สูงสุด 120 mg/วัน [81]","• ปรับเพิ่มครั้งละ 30 mg ห่างกันอย่างน้อย 1 เดือน ยกเว้นน้ำตาลไม่ลดลงหลัง 2 สัปดาห์ [81]"]],["ขนาดยาเด็ก",["ไม่มีข้อบ่งใช้ในเด็ก"]],["การบริหารยา",["รับประทานพร้อมอาหารเช้า กลืนทั้งเม็ดหรือครึ่งเม็ด ห้ามเคี้ยวหรือบด; ลืมรับประทานห้ามเพิ่มขนาดในวันถัดไป [81]; ผู้ป่วยในส่วนใหญ่ insulin เป็นการรักษาที่แนะนำ โดยเฉพาะผู้ที่รับประทานอาหารได้น้อยหรืองดอาหาร [37]; งดยาเบาหวานชนิดรับประทานในวันผ่าตัดหรือวันทำหัตถการ [37]"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: แพ้ gliclazide, sulfonylurea หรือ sulphonamide, เบาหวานชนิดที่ 1, diabetic pre-coma/coma หรือ ketoacidosis, ไตหรือตับบกพร่องรุนแรง, ใช้ร่วมกับ miconazole, ตั้งครรภ์และให้นมบุตร [81]; ระวัง: รับประทานอาหารล่าช้า น้อย หรือคาร์โบไฮเดรตต่ำ (เพิ่มความเสี่ยงน้ำตาลต่ำ); ภาวะขาดอาหาร, โรคต่อมไร้ท่อรุนแรง, หยุด corticosteroid ขนาดสูงหรือใช้นาน, โรคหลอดเลือดรุนแรง (เริ่ม 30 mg/วัน); ไตบกพร่องเล็กน้อยถึงปานกลางไม่ต้องปรับขนาด [81]"]],["การติดตาม",["ผู้ป่วยใน: เจาะน้ำตาลปลายนิ้วก่อนอาหาร หรือทุก 4–6 ชม. หากไม่ได้รับประทานอาหาร [37]; อาการน้ำตาลต่ำ; การรับประทานอาหาร"]],["เกณฑ์แจ้งแพทย์",["ระดับน้ำตาล < 70 mg/dL หรือมีอาการน้ำตาลต่ำ [37]; รับประทานอาหารไม่ได้หรืองดน้ำงดอาหาร"]],["อาการไม่พึงประสงค์",["น้ำตาลในเลือดต่ำ"]],["การแก้ไข",["รู้สึกตัวและกลืนได้: คาร์โบไฮเดรตออกฤทธิ์เร็ว 15 g; กลืนไม่ได้หรืองดอาหาร: glucose ทางหลอดเลือดดำ (HAD-22) หรือ glucagon; ตรวจน้ำตาลทุก 15 นาทีและให้การรักษาซ้ำจนแก้ไขได้ [37]"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-41 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[81], [37], [1]"]]]},"HAD-42":{"id":"HAD-42","title":"Chloral Hydrate Syrup 200 mg/5 mL (oral solution) [SP] (HAD)","rows":[["กลุ่มยา",["Sedation agent, oral, for children (minimal/moderate sedation)"]],["ความแรง",["200 mg/5 mL (40 mg/mL)"]],["ข้อบ่งใช้",["ให้เด็กสงบเพื่อทำหัตถการหรือการตรวจ (procedural sedation) ตามแพทย์สั่ง [82]"]],["ขนาดยาเด็ก",["20–25 mg/kg ทางปากก่อนทำหัตถการ; ผู้เชี่ยวชาญบางส่วนใช้ 25–100 mg/kg; สูงสุด 1 g ในทารก และ 2 g ในเด็ก [82]"]],["ขนาดยาผู้ใหญ่",["ไม่ใช่ข้อบ่งใช้หลักของโรงพยาบาล ใช้ตามแพทย์สั่ง"]],["การบริหารยา",["เจือจางยาในน้ำหรือน้ำผลไม้ประมาณครึ่งแก้วเพื่อลดการระคายเคืองกระเพาะ [82]; ให้ยาภายใต้การดูแลของบุคลากรทางการแพทย์เท่านั้น ห้ามให้ยาที่บ้านก่อนมาโรงพยาบาล; เตรียมอุปกรณ์ตาม SOAPME (suction, oxygen, airway, pharmacy, monitors, equipment) ให้พร้อม [71]; ยาน้ำเด็กที่ต้องตวงจัดเป็นยาความเสี่ยงสูง ตรวจสอบขนาดยาที่ตวงให้ถูกต้อง [83]"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: ตับหรือไตบกพร่องมาก, แพ้ยา; หลีกเลี่ยงการรับประทานในผู้ที่มีหลอดอาหารอักเสบ กระเพาะอักเสบ หรือแผลในกระเพาะอาหาร; หลีกเลี่ยงขนาดสูงในโรคหัวใจรุนแรง [82]; ยาออกฤทธิ์นาน อาจกลับมาง่วงซ้ำหลังจำหน่าย เสี่ยงทางเดินหายใจอุดกั้นโดยเฉพาะทารกและเด็กเล็กที่นั่ง car seat ต้องสังเกตอาการนานขึ้น [71]"]],["การติดตาม",["moderate sedation: SpO2 และ HR ต่อเนื่อง บันทึก HR, RR, BP และ SpO2 อย่างน้อยทุก 10 นาที; ช่วงฟื้นตัวบันทึกเป็นระยะจนผ่านเกณฑ์จำหน่าย และสังเกตนานขึ้นเพราะยาออกฤทธิ์นาน [71]"]],["เกณฑ์แจ้งแพทย์",["SpO2 ลดลง, หยุดหายใจหรือทางเดินหายใจอุดกั้น, ปลุกไม่ตื่น (sedation score 3), กลับมาง่วงซ้ำหลังตื่น [71]"]],["อาการไม่พึงประสงค์",["ระคายเคืองกระเพาะอาหาร, สับสนหรือมึนงง [82]; ง่วงซึมนานหรือกลับมาง่วงซ้ำ, ทางเดินหายใจอุดกั้น [71]"]],["การแก้ไข",["จัดการทางเดินหายใจตามแนวทาง (จัดท่าเปิดทางเดินหายใจ ให้ออกซิเจน ช่วยหายใจด้วย bag-valve-mask) และแจ้งแพทย์ทันที [71]"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-42 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[82], [71], [83], [1]"]]]},"HAD-43":{"id":"HAD-43","title":"Tranexamic Acid INJ (250 mg/ 5 mL) 5 mL (Transamin®) (HAD)","rows":[["กลุ่มยา",["Antifibrinolytic, IV (tranexamic acid injection)"]],["ความแรง",["250 mg/5 mL (50 mg/mL); 1 g = 4 amp"]],["ข้อบ่งใช้",["ตามเอกสารกำกับยา: ลดหรือป้องกันเลือดออกในผู้ป่วยฮีโมฟีเลียที่ถอนฟัน [85]; การผ่าตัดข้อสะโพกและข้อเข่าเทียม: ลดการเสียเลือดและการให้เลือด [87]"]],["ขนาดยาผู้ใหญ่",["• เอกสารกำกับยา: 10 mg/kg (น้ำหนักจริง) IV ต่อครั้ง [85]","• ผ่าตัดข้อเทียม: ขนาดตามแพทย์สั่ง ขนาดที่ใช้ในการศึกษาไม่ทำให้ผลต่างกันอย่างมีนัยสำคัญ; ให้ IV ก่อนลงมีดอาจลดการเสียเลือดและการให้เลือด; ให้หลายครั้งไม่เพิ่มประโยชน์เมื่อเทียบกับครั้งเดียว [87]","• ไตบกพร่อง (serum creatinine): 1.36–2.83 mg/dL 10 mg/kg วันละ 2 ครั้ง; 2.83–5.66 mg/dL 10 mg/kg วันละครั้ง; > 5.66 mg/dL 10 mg/kg ทุก 48 ชม. หรือ 5 mg/kg ทุก 24 ชม. [85]"]],["ขนาดยาเด็ก",["ตามแพทย์สั่ง"]],["การเตรียม/ผสม",["ให้ได้ทั้งไม่เจือจาง หรือเจือจางเป็น 10–20 mg/mL; สารละลายที่เจือจางแล้วเก็บที่อุณหภูมิห้องได้ไม่เกิน 4 ชม.; ห้ามผสมกับเลือดหรือสารละลายที่มี penicillin [85]"]],["การบริหารยา",["ฉีดเข้าหลอดเลือดดำเท่านั้น ห้ามฉีดเข้าช่องไขสันหลังหรือช่องเหนือไขสันหลัง (boxed warning); ตรวจสอบทางให้ยาและติดฉลากกระบอกยาให้ชัดเจนทุกครั้ง [85]; ฉีดช้า ยาไม่เจือจางไม่เกิน 1 mL/นาทีของยา 100 mg/mL (เทียบเท่า 100 mg/นาที) เพื่อป้องกันความดันต่ำ [85]"]],["การเก็บรักษา",["เก็บที่ 20–25 °C [85]; เก็บแยกห่างจากยาชาเฉพาะที่ (BUPivacaine, ROPivacaine) วางให้เห็นฉลาก ไม่ใช้สีฝาในการแยกยา และติดฉลากเสริมระบุทางให้ยา \"ฉีดเข้าหลอดเลือดดำเท่านั้น\" [86]"]],["ข้อห้ามใช้/ข้อควรระวัง",["ห้ามใช้: ฉีดเข้าช่องไขสันหลังหรือช่องเหนือไขสันหลัง, subarachnoid hemorrhage, มีลิ่มเลือดในหลอดเลือดอยู่ (active intravascular clotting), แพ้ยา; ระวัง: เสี่ยงลิ่มเลือดอุดตันในหลอดเลือดดำและแดง หลีกเลี่ยงการใช้ร่วมกับยาที่ทำให้เลือดแข็งตัวง่าย (เช่น factor IX complex, ฮอร์โมนคุมกำเนิด), ชัก, เวียนศีรษะ [85]; ผู้ป่วยเสี่ยงลิ่มเลือดสูงพิจารณาเป็นรายบุคคลร่วมกันหลายสาขา [87]"]],["การติดตาม",["ทางให้ยาก่อนให้ทุกครั้ง [85]; BP ระหว่างฉีด (ฉีดเร็วทำให้ความดันต่ำ) [85] อย่างน้อยทุก 5 นาทีระหว่างการระงับความรู้สึก [78]; อาการชัก แพ้ และลิ่มเลือดอุดตัน [85]"]],["เกณฑ์แจ้งแพทย์",["สงสัยให้ผิดทาง (ฉีดเข้าไขสันหลัง: กล้ามเนื้อกระตุก ชัก) [86]; ชัก; ความดันต่ำระหว่างฉีด; อาการแพ้; อาการสงสัยลิ่มเลือดอุดตัน [85]"]],["อาการไม่พึงประสงค์",["คลื่นไส้ อาเจียน ท้องเสีย ผื่นแพ้ เวียนศีรษะ ลิ่มเลือดอุดตัน; ความดันต่ำเมื่อฉีดเร็ว; ชักและการมองเห็นผิดปกติ (รายงานหลังวางตลาด) [85]; ฉีดผิดเข้าไขสันหลัง: ชัก บาดเจ็บทางระบบประสาทถาวร อัมพาต อัตราตายประมาณร้อยละ 50 [86]"]],["การแก้ไข",["หยุดยาเมื่อชักหรือแพ้รุนแรงและไม่ให้ซ้ำ [85]; สงสัยฉีดผิดทาง แจ้งแพทย์ทันทีและช่วยชีวิตตามแนวทาง"]],["แบบเฝ้าระวัง",["แบบเฝ้าระวัง HAD-43 (เอกสารสนับสนุน SD)"]],["เอกสารอ้างอิง",["[85], [86], [87], [78], [1]"]]]}},"refs":{"1":"Institute for Safe Medication Practices. ISMP list of high-alert medications in acute care settings [Internet]. Plymouth Meeting (PA): ISMP; 2024 [cited 2026 Oct 12]. Available from: https://www.ismp.org/recommendations/high-alert-medications-acute-list","7":"Pan <script>
(function () {
  'use strict';
  const D = HAD_DATA, ITEMS = D.items || [], MONO = D.mono || {}, REFS = D.refs || {};
  const $ = id => document.getElementById(id);
  const q = $('q'), dd = $('dd'), view = $('view'), clr = $('clr');
  let act = -1, shown = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function rich(s) { return esc(s).replace(/⟦(.*?)⟧/g, '<mark class="pend" title="จุดรอตรวจสอบ">$1</mark>'); }
  function norm(s) { return String(s).toLowerCase().replace(/[\s\-_/().,\[\]*®™]+/g, ' ').trim(); }
  function hadNum(h) { return h ? parseInt(h.slice(4), 10) : 999; }

  // ดัชนีค้นหา: ชื่อยาตาม Index + รหัส + HAD-xx + กลุ่มยา + ชื่อหัวข้อ monograph
  ITEMS.forEach(it => {
    const m = it.h ? MONO[it.h] : null;
    it._s = norm([it.n, it.c, it.h || '', it.g, m ? m.title : ''].join(' '));
    it._n = norm(it.n);
  });
  const SORTED = ITEMS.slice().sort((a, b) => hadNum(a.h) - hadNum(b.h) || a.n.localeCompare(b.n));

  function search(text) {
    const t = norm(text);
    if (!t) return SORTED;
    const toks = t.split(' ').filter(Boolean);
    const res = [];
    ITEMS.forEach(it => {
      if (!toks.every(k => it._s.includes(k))) return;
      let score = 0;
      if (it._n.startsWith(t)) score -= 100;
      else if ((' ' + it._n).includes(' ' + toks[0])) score -= 50;
      if (it.v) score += 5; // รหัส N / Z (แบ่งขาย) ไว้ท้าย
      res.push([score, it]);
    });
    return res.sort((a, b) => a[0] - b[0] || hadNum(a[1].h) - hadNum(b[1].h)).map(x => x[1]);
  }

  function hl(name, text) {
    const toks = norm(text).split(' ').filter(Boolean);
    if (!toks.length) return esc(name);
    // ไฮไลต์ตัวอักษรที่ตรงกับคำค้น (ไม่สนตัวพิมพ์เล็ก-ใหญ่)
    const low = name.toLowerCase(), mark = new Array(name.length).fill(false);
    toks.forEach(k => { let i = 0; while ((i = low.indexOf(k, i)) >= 0) { for (let j = i; j < i + k.length; j++) mark[j] = true; i += k.length; } });
    let out = '', on = false;
    for (let i = 0; i < name.length; i++) {
      if (mark[i] && !on) { out += '<mark>'; on = true; }
      if (!mark[i] && on) { out += '</mark>'; on = false; }
      out += esc(name[i]);
    }
    return out + (on ? '</mark>' : '');
  }

  function renderDd() {
    const text = q.value;
    clr.style.display = text ? 'block' : 'none';
    shown = search(text).slice(0, 30);
    act = shown.length ? 0 : -1;
    dd.innerHTML = shown.length ? shown.map((it, i) =>
      '<div class="opt' + (i === act ? ' act' : '') + '" role="option" data-i="' + i + '">' +
        '<span class="id' + (it.h ? '' : ' none') + '">' + esc(it.h || 'HAD') + '</span>' +
        '<div><div class="nm">' + hl(it.n, text) + '</div><div class="sub">' + esc(it.c) + (it.g ? ' · ' + esc(it.g) : '') + '</div></div>' +
      '</div>').join('') : '<div class="empty">ไม่พบยาความเสี่ยงสูงที่ตรงกับ "' + esc(text) + '"</div>';
    dd.classList.add('show');
  }
  function closeDd() { dd.classList.remove('show'); }
  function setAct(i) {
    const opts = dd.querySelectorAll('.opt');
    if (!opts.length) return;
    act = (i + opts.length) % opts.length;
    opts.forEach((o, j) => o.classList.toggle('act', j === act));
    opts[act].scrollIntoView({ block: 'nearest' });
  }

  q.addEventListener('input', renderDd);
  q.addEventListener('focus', renderDd);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!dd.classList.contains('show')) renderDd(); else setAct(act + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(act - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (shown[act]) pick(shown[act]); }
    else if (e.key === 'Escape') { closeDd(); q.blur(); }
  });
  dd.addEventListener('mousedown', e => {
    const o = e.target.closest('.opt'); if (!o) return;
    e.preventDefault(); pick(shown[+o.dataset.i]);
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) closeDd(); });
  clr.addEventListener('click', () => { q.value = ''; q.focus(); renderDd(); });

  function pick(it) {
    closeDd(); q.value = ''; clr.style.display = 'none'; q.blur();
    try { history.pushState({ c: it.c }, '', '?c=' + encodeURIComponent(it.c)); } catch (e) { /* เปิดจากไฟล์/preview ที่เปลี่ยน URL ไม่ได้ */ }
    showItem(it);
  }

  // ---------- หน้า monograph ----------
  const SECTIONS = [
    { key: 'what', ic: '💊', t: 'ยานี้คืออะไร', m: l => /^(กลุ่มยา|ความแรง|ลักษณะ|ขอบเขต|ข้อบ่งใช้(?!\/ขนาด)|การออกฤทธิ์|รูปแบบ|หมายเหตุ)/.test(l) },
    { key: 'dose', ic: '📏', t: 'ขนาดยา', m: l => /ขนาดยา|การปรับขนาด|การทำงานของไต/.test(l) },
    { key: 'prep', ic: '🧪', t: 'การผสมและการเก็บรักษา', cls: 'prep', m: l => /การเตรียม|การเก็บรักษา/.test(l) },
    { key: 'admin', ic: '💉', t: 'วิธีให้ยาและทางที่ให้', m: l => /การบริหาร|การจ่ายยา|การส่งมอบ|ผิดทาง/.test(l) },
    { key: 'mon', ic: '👁️', t: 'การติดตามและเกณฑ์แจ้งแพทย์', cls: 'alert', m: l => /การติดตาม|เกณฑ์แจ้งแพทย์|แบบเฝ้าระวัง/.test(l) },
    { key: 'safe', ic: '⚠️', t: 'ข้อห้าม อาการไม่พึงประสงค์ และการแก้ไข', m: l => /ข้อห้าม|อาการไม่พึงประสงค์|อันตรกิริยา|การแก้ไข|ยาต้าน|ยาแก้/.test(l) }
  ];

  function rowHtml(lab, val, extraCls) {
    const bullets = val.filter(v => /^•/.test(v));
    let body;
    if (val.length > 1 || bullets.length) {
      body = '<ul>' + val.map(v => '<li>' + rich(v.replace(/^•\s*/, '')) + '</li>').join('') + '</ul>';
    } else body = '<p>' + rich(val[0] || '') + '</p>';
    return '<div class="row' + (extraCls ? ' ' + extraCls : '') + '">' + (lab ? '<div class="lab">' + esc(lab) + '</div>' : '') + body + '</div>';
  }

  function showItem(it) {
    const m = it.h ? MONO[it.h] : null;
    const siblings = ITEMS.filter(x => x.h && x.h === it.h);
    let h = '<button class="back" id="backb">‹ รายการทั้งหมด</button>';
    h += '<div class="card"><div class="mh"><div>' +
      '<span class="hid">' + esc(it.h || 'HAD') + '</span>' +
      '<h2>' + esc(it.n) + '</h2>' +
      '<div class="meta">รหัสยา <b>' + esc(it.c) + '</b>' + (it.u ? ' · หน่วย ' + esc(it.u) : '') + (it.g ? '<br>' + esc(it.g) : '') + '</div>' +
      '</div><div class="hbtns"><button class="qrbtn" id="qrb">▦ QR</button><button class="qrbtn frm" id="frmb" hidden>📄 แบบเฝ้าระวัง A5</button></div></div>';
    if (siblings.length > 1) {
      h += '<div class="codes">' + siblings.filter(x => x.c !== it.c).map(x => '<span title="' + esc(x.n) + '">ใช้แนวทางเดียวกัน: ' + esc(x.c) + '</span>').join('') + '</div>';
    }
    h += '</div>';
    h += '<div class="warn"><b>ข้อควรทราบ:</b> ขนาดยาเป็นข้อมูลอ้างอิง ให้ปฏิบัติตามคำสั่งแพทย์ ตรวจสอบชื่อยา ความแรง และความเข้มข้นกับฉลากทุกครั้ง หากสงสัยให้ติดต่อเภสัชกรก่อนให้ยา' +
      (it.f ? '<br>แบบเฝ้าระวัง: <b>' + esc(it.f) + '</b>' : '') + '</div>';
    if (!m) {
      h += '<div class="card nomono">ยารายการนี้อยู่ในบัญชียาความเสี่ยงสูงของ Index แต่ยังไม่มีแนวทางการใช้ยาในนโยบาย HAD กรุณาติดต่อเภสัชกร</div>';
      view.innerHTML = h; bindQr(it); window.scrollTo(0, 0); return;
    }
    const groups = SECTIONS.map(() => []), other = [];
    let refRow = null;
    m.rows.forEach(r => {
      const lab = r[0];
      if (lab === 'เอกสารอ้างอิง') { refRow = r; return; }
      const i = SECTIONS.findIndex(s => s.m(lab));
      (i >= 0 ? groups[i] : other).push(r);
    });
    if (other.length) groups[0].push(...other);
    const present = SECTIONS.map((s, i) => [s, groups[i]]).filter(x => x[1].length);
    h += '<nav class="chips" id="chips">' + present.map(([s]) => '<button class="chip" data-k="' + s.key + '">' + s.ic + ' ' + esc(s.t) + '</button>').join('') +
      (refRow ? '<button class="chip" data-k="refs">📚 อ้างอิง</button>' : '') + '</nav>';
    present.forEach(([s, rows]) => {
      h += '<section class="card sec' + (s.cls ? ' ' + s.cls : '') + '" id="s-' + s.key + '"><h3><span class="ic">' + s.ic + '</span>' + esc(s.t) + '</h3>' +
        rows.map(r => rowHtml(r[0], r[1], /เกณฑ์แจ้งแพทย์/.test(r[0]) ? 'notify' : '')).join('') + '</section>';
    });
    if (refRow) {
      const nums = [...new Set(refRow[1].join(' ').match(/\d+/g) || [])];
      h += '<section class="card sec refs" id="s-refs"><h3><span class="ic">📚</span>เอกสารอ้างอิง</h3><ol>' +
        nums.map(n => '<li><b>[' + n + ']</b> ' + esc(REFS[n] || '') + '</li>').join('') + '</ol></section>';
    }
    view.innerHTML = h;
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      const el = $('s-' + c.dataset.k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
    bindQr(it);
    window.scrollTo(0, 0);
  }

  function showHome() {
    const groups = {};
    SORTED.forEach(it => { const k = it.h || 'zz'; (groups[k] = groups[k] || []).push(it); });
    let h = '<div class="card intro"><h2>ค้นหาข้อมูลยาความเสี่ยงสูง</h2>' +
      '<p>พิมพ์ชื่อยาบางส่วนในช่องค้นหาด้านบน (เช่น "nor", "kcl", "insulin") ระบบจะแสดงรายการให้เลือก หรือเลือกจากรายการด้านล่าง</p>' +
      '<p>ข้อมูลแต่ละรายการ: ยานี้คืออะไร · ขนาดยา · การผสมและการเก็บรักษา · วิธีให้ยาและทางที่ให้ · การติดตามและเกณฑ์แจ้งแพทย์ · ข้อห้ามและการแก้ไข</p>' +
      '<div class="list">' + Object.keys(groups).map(k => {
        const it = groups[k].find(x => !x.v) || groups[k][0];
        const more = groups[k].length - 1;
        return '<button class="li" data-c="' + esc(it.c) + '"><span class="id">' + esc(it.h || 'HAD') + '</span><span class="nm">' + esc(it.n) +
          (more > 0 ? ' <span style="color:var(--muted);font-size:12.5px">(+' + more + ' รหัส)</span>' : '') + '</span></button>';
      }).join('') + '</div></div>';
    view.innerHTML = h;
    view.querySelectorAll('.li').forEach(b => b.addEventListener('click', () => pick(ITEMS.find(x => x.c === b.dataset.c))));
  }

  function route() {
    const p = new URLSearchParams(location.search);
    const c = p.get('c') || p.get('code');
    const hash = decodeURIComponent(location.hash.slice(1)).toUpperCase();
    let it = c ? ITEMS.find(x => x.c === c) : null;
    if (!it && /^HAD-\d+$/.test(hash)) it = ITEMS.find(x => x.h === hash && !x.v) || ITEMS.find(x => x.h === hash);
    if (it) showItem(it); else showHome();
  }
  window.addEventListener('popstate', route);

  // ---------- QR สำหรับติดกล่อง/กระบะยา ----------
  function bindQr(it) {
    bindForm(it);
    const bk = $('backb');
    if (bk) bk.addEventListener('click', () => {
      if (history.state && history.state.c) history.back();
      else { try { history.replaceState(null, '', location.pathname); } catch (e) {} showHome(); window.scrollTo(0, 0); }
    });
    const b = $('qrb'); if (!b) return;
    b.addEventListener('click', () => {
      const url = location.origin + location.pathname + '?c=' + encodeURIComponent(it.c);
      let svg = '';
      try { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); svg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { svg = '<p>สร้าง QR ไม่ได้ (ไม่มีอินเทอร์เน็ต)</p>'; }
      $('qrbox').innerHTML = svg + '<div style="font-size:14px;font-weight:700;margin-top:6px">' + esc(it.h || '') + ' ' + esc(it.n) + '</div>';
      $('qrurl').textContent = url;
      $('qrm').classList.add('show');
      document.body.classList.add('qr-open');
    });
  }
  // ---------- แบบเฝ้าระวัง A5 (2026-11-18) ----------
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzuBl87e9Xc61jtFItkslSeJMsIMt8LaJQ4gmLO6_JxaarnCA5m2EecnqNIjNbwSaKP/exec';
  let FORMS = null, curIt = null, curForm = '', busy = false;
  fetch('had_forms/index.json', { cache: 'no-cache' }).then(r => r.json()).then(j => { FORMS = j.forms || []; if (curIt) bindForm(curIt); }).catch(() => { FORMS = []; });
  function formOf(it) { const m = /^HAD-\d{2}/.exec(it.f || ''); return m && FORMS && FORMS.indexOf(m[0]) >= 0 ? m[0] : ''; }
  function bindForm(it) {
    curIt = it;
    const b = $('frmb'); if (!b) return;
    const f = formOf(it);
    b.hidden = !f;
    b.onclick = f ? () => openForm(it, f) : null;
  }
  function ageText(sec) { return sec == null ? null : sec < 90 ? 'พร้อมใช้งาน' : 'ไม่ตอบ ' + Math.round(sec / 60) + ' นาที'; }
  function stHtml(sec, none) { return '<span class="dot ' + (sec != null && sec < 90 ? 'on' : 'off') + '"></span>' + esc(ageText(sec) || none); }
  async function openForm(it, f) {
    curForm = f;
    $('fid').textContent = f; $('fname').textContent = it.n;
    $('fA5').href = 'had_forms/' + f + '.pdf';
    $('fst').className = 'fst'; $('fst').textContent = '';
    $('frm').classList.add('show');
    $('fPhaSt').innerHTML = $('fWardSt').innerHTML = '<span class="dot"></span>กำลังตรวจสถานะ…';
    try {
      const p = await fetch(GAS_URL + '?action=medrecPrinters').then(r => r.json());
      $('fPhaSt').innerHTML = stHtml(p.pha, 'ไม่พบเครื่อง');
      $('fWardSt').innerHTML = stHtml(p.ward, 'ยังไม่ได้ติดตั้งคิวพิมพ์');
      $('fWard').disabled = p.ward == null;
    } catch (e) { $('fPhaSt').textContent = $('fWardSt').textContent = 'ตรวจสถานะไม่ได้'; }
  }
  window.closeForm = () => { $('frm').classList.remove('show'); };
  $('frm').addEventListener('click', e => { if (e.target.id === 'frm') closeForm(); });
  $('fcnt').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2); });
  $('fcnt').addEventListener('blur', e => { const n = Math.max(1, Math.min(10, parseInt(e.target.value, 10) || 1)); e.target.value = n; });
  async function sendForm(target) {
    if (busy || !curForm) return;
    const n = Math.max(1, Math.min(10, parseInt($('fcnt').value, 10) || 1)); $('fcnt').value = n;
    const where = target === 'ward' ? 'Ward (LKPC-16)' : 'ห้องยา (LKPC-08)', st = $('fst');
    busy = true; $('fPha').disabled = true; $('fWard').disabled = true;
    st.className = 'fst'; st.textContent = '⏳ กำลังส่งงานพิมพ์…';
    try {
      const j = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'hadFormPrint', form: curForm, target: target, count: n }) }).then(r => r.json());
      if (j.status !== 'ok') throw new Error(j.msg || 'ส่งพิมพ์ไม่สำเร็จ');
      st.textContent = '⏳ ส่ง ' + curForm + ' จำนวน ' + n + ' ใบ เข้าคิว ' + where + ' แล้ว กำลังรอพิมพ์…';
      for (let i = 0; i < 10; i++) {   // wait=20 → GAS ถือ request รอผล ตอบทันทีที่พิมพ์เสร็จ (2026-11-18)
        const s = await fetch(GAS_URL + '?action=getPrintJobStatus&wait=20&jobId=' + encodeURIComponent(j.jobId)).then(r => r.json());
        if (s.jobStatus === 'PRINTED') { st.className = 'fst ok'; st.textContent = '✅ พิมพ์ ' + curForm + ' แล้วที่ ' + where; return; }
        if (s.jobStatus === 'ERROR') throw new Error('เครื่องพิมพ์แจ้งข้อผิดพลาด: ' + (s.errorMsg || ''));
      }
      st.className = 'fst warn'; st.textContent = '⚠️ ยังไม่ได้รับการยืนยันการพิมพ์ — ตรวจที่เครื่องพิมพ์ ' + where;
    } catch (e) { st.className = 'fst err'; st.textContent = '❌ ' + e.message; }
    finally { busy = false; $('fPha').disabled = false; openForm(curIt, curForm).catch(() => {}); }
  }
  $('fPha').addEventListener('click', () => sendForm('pha'));
  $('fWard').addEventListener('click', () => sendForm('ward'));
  window.closeQr = () => { $('qrm').classList.remove('show'); document.body.classList.remove('qr-open'); };
  $('qrm').addEventListener('click', e => { if (e.target.id === 'qrm') closeQr(); });

  function fitHeader() { document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); }
  window.addEventListener('resize', fitHeader);
  fitHeader();
  $('foot').innerHTML = 'ที่มา: ' + esc(D.policy || '') + ' (ภาคผนวก ค) · รายชื่อยาตาม Index ' + esc(D.indexDate || '') + ' · ' + ITEMS.length + ' รหัส / ' + Object.keys(MONO).length + ' แนวทาง';
  route();
})();
</script>
</body>
</html>
