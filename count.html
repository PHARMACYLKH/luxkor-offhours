<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>นับ Stock ห้องยา - Lux Kor Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* อังกฤษ/ตัวเลข = Arial จากเครื่อง; Android ไม่มี Arial จึงใช้ Arimo (ขนาดตัวอักษรเท่า Arial); ไทย = Sarabun */
  @font-face { font-family: 'LK Latin'; src: local('Arial'); font-weight: 400; unicode-range: U+0000-0DFF, U+0E80-FFFF; }
  @font-face { font-family: 'LK Latin'; src: local('Arial Bold'), local('Arial-BoldMT'); font-weight: 700; unicode-range: U+0000-0DFF, U+0E80-FFFF; }
  :root {
    --green: #0f613b; --green-dark: #0b4a2d; --green-soft: #e7f2ec; --gold: #a27e2c; --gold-soft: #f8f1e0;
    --bg: #f4f6f5; --card: #fff; --text: #1f2a24; --muted: #66756d; --line: #dfe6e2;
    --danger: #b3261e; --danger-soft: #fdecea; --radius: 14px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'LK Latin', 'Arimo', 'Sarabun', sans-serif; font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--green); color: #fff; padding: 10px 16px; }
  .top-in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .top h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { min-width: 40px; height: 40px; border-radius: 10px; color: #fff; font-size: 22px; background: rgba(255,255,255,.14); }
  .pill { font-size: 14px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.16); white-space: nowrap; }
  .pill.wait { background: var(--gold); }
  .pill.bad { background: var(--danger); }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-top: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  input.t, select.t, textarea.t { width: 100%; min-height: 50px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #fff; font-size: 18px; }
  input.t:focus, select.t:focus, textarea.t:focus { outline: none; border-color: var(--green); }
  .row3 { display: grid; grid-template-columns: 1fr 1.1fr 1.3fr; gap: 8px; }
  .row3 select.t { padding: 10px 6px; }
  .btn { display: block; width: 100%; min-height: 52px; border-radius: var(--radius-sm); font-weight: 700; font-size: 18px; padding: 10px 14px; }
  .btn.pri { background: var(--green); color: #fff; }
  .btn.sec { background: var(--green-soft); color: var(--green-dark); }
  .btn.gold { background: var(--gold); color: #fff; }
  .btn.ghost { background: #fff; color: var(--muted); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .55; }
  .btns { display: grid; gap: 10px; margin-top: 16px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #e3e9e6; padding: 4px; border-radius: 12px; margin-top: 14px; }
  .seg button { min-height: 46px; border-radius: 9px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--green-dark); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .prog { margin-top: 12px; }
  .prog-t { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); margin-bottom: 5px; }
  .bar { height: 9px; background: #e3e9e6; border-radius: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .3s ease; }
  .search { margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { background: #fff; border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.07); min-height: 84px; }
  .tile b { display: block; font-size: 24px; color: var(--green-dark); line-height: 1.15; }
  .tile.small b { font-size: 16px; line-height: 1.3; }
  .tile span { font-size: 14px; color: var(--muted); }
  .tile.done { background: var(--green-soft); }
  .tile.exp { background: var(--danger); }
  .tile.exp b, .tile.exp span { color: #fff; }
  .tile.gold { background: var(--gold); }
  @font-face { font-family: RptThai; font-weight: 400; src: local('TH SarabunPSK'), url('fonts/THSarabun.ttf') format('truetype'); unicode-range: U+0E00-0E7F; size-adjust: 130%; }
  @font-face { font-family: RptThai; font-weight: 700; src: local('TH SarabunPSK Bold'), url('fonts/THSarabun-Bold.ttf') format('truetype'); unicode-range: U+0E00-0E7F; size-adjust: 130%; }
  #report { display: none; font-family: RptThai, Arial, sans-serif; color: #000; font-size: 10pt; line-height: 1.3; }
  #report .rp-head { text-align: center; margin-bottom: 8px; }
  #report h1 { font-size: 14pt; margin: 2px 0; color: #000; }
  #report table { width: 100%; border-collapse: collapse; }
  #report th, #report td { border: 0.5pt solid #555; padding: 2px 4px; text-align: left; vertical-align: top; }
  #report th { background: #e8efe9; }
  #report .n { text-align: right; white-space: nowrap; }
  #report tr { break-inside: avoid; }
  #report .rp-sign { display: flex; justify-content: space-between; margin-top: 28px; break-inside: avoid; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; }
    body > *:not(#report) { display: none !important; }
    #report { display: block !important; }
  }
  .spin { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -2px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spinit .7s linear infinite; }
  @keyframes spinit { to { transform: rotate(360deg); } }
  .btn:disabled { opacity: .75; cursor: wait; }
  .tile.box-t { background: #fbf3df; }
  .tile.box-t b { color: #7a5d1c; }
  .tile.near-t { background: #f5a623; }
  .tile.near-t b, .tile.near-t span { color: #2b2111; }
  .tile.gold b, .tile.gold span { color: #fff; }
  .item.static { cursor: default; display: block; }
  .list { margin-top: 14px; display: grid; gap: 8px; }
  .item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: #fff; border-radius: var(--radius-sm); padding: 11px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); min-height: 62px; }
  .item.done { background: var(--green-soft); }
  .item .loc { flex: 0 0 auto; min-width: 48px; font-weight: 700; color: var(--green-dark); text-align: center; font-size: 15px; }
  .item .nm { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
  .item .st { flex: 0 0 auto; font-size: 14px; color: var(--green-dark); font-weight: 600; text-align: right; }
  .had { color: #fff; background: var(--danger); font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 5px; margin-left: 4px; white-space: nowrap; }
  .had.exp { background: #333a40; }
  .had.near { background: #f5a623; color: #2b2111; }
  .had.xl { background: #e4e9f0; color: #2f4a6b; box-shadow: inset 0 0 0 1px #2f4a6b; }
  .sub { color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { min-height: 40px; padding: 6px 12px; border-radius: 99px; background: var(--gold-soft); color: #6d5317; font-size: 15px; font-weight: 600; }
  .lot { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lot:first-child { border-top: 0; }
  .lot > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .lot button { min-width: 62px; min-height: 40px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 15px; font-weight: 600; }
  .warn { margin-top: 14px; padding: 11px 13px; border-radius: var(--radius-sm); background: var(--gold-soft); color: #6d5317; font-weight: 600; }
  .warn.red { background: var(--danger-soft); color: var(--danger); }
  .check { display: inline-flex; width: fit-content; align-items: center; gap: 9px; margin-top: 9px; font-size: 16px; min-height: 36px; }
  .check input { width: 26px; height: 26px; margin: 0; accent-color: var(--green); }
  .link { color: var(--green-dark); font-weight: 600; text-decoration: underline; padding: 8px 0; min-height: 40px; font-size: 16px; }
  .calc { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 8px; }
  .calc input { min-width: 0; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30; background: #17231d; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 16px; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .empty { text-align: center; color: var(--muted); padding: 26px 8px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; animation: slide .2s ease; }
  @keyframes slide { from { transform: translateY(16px); opacity: .4; } to { transform: none; opacity: 1; } }
  .title { font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
  .save-overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.9); opacity: 0; visibility: hidden; transition: opacity .18s ease; pointer-events: none; }
  .save-overlay.show { opacity: 1; visibility: visible; }
  .save-success { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .check-circle { width: 92px; height: 92px; }
  .check-circle-bg { fill: none; stroke: var(--green); stroke-width: 4; stroke-dasharray: 227; stroke-dashoffset: 227; animation: circleDraw .4s ease forwards; }
  .check-mark { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 49; stroke-dashoffset: 49; animation: checkDraw .28s ease .32s forwards; }
  @keyframes circleDraw { to { stroke-dashoffset: 0; } }
  @keyframes checkDraw { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { to { opacity: 1; } }
  .save-success-logo { width: 110px; height: auto; opacity: 0; animation: fadeIn .3s ease .45s forwards; }
  .save-success-text { font-size: 18px; font-weight: 700; color: var(--green-dark); opacity: 0; animation: fadeIn .3s ease .55s forwards; }
  .modal { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,30,22,.55); }
  .modal .card { width: 100%; max-width: 420px; margin: 0; }
  .login { position: relative; min-height: 100vh; min-height: 100dvh; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .deco { position: absolute; display: block; pointer-events: none; }
  .deco.d1 { width: 190px; height: 190px; border-radius: 50%; background: var(--green); top: -78px; left: -66px; }
  .deco.d2 { width: 74px; height: 74px; border-radius: 18px; background: var(--gold); top: 46px; right: -22px; transform: rotate(18deg); }
  .deco.d3 { width: 230px; height: 230px; border-radius: 50%; background: var(--gold-soft); bottom: -104px; left: -72px; }
  .deco.d4 { width: 130px; height: 130px; border-radius: 30px; background: var(--green-soft); bottom: -34px; right: -30px; transform: rotate(-14deg); }
  .login-box { position: relative; width: 100%; max-width: 360px; text-align: center; animation: rise .35s ease; }
  .login-logo { display: block; width: 210px; height: auto; margin: 0 auto; }
  .login-box h1 { margin: 22px 0 4px; font-size: 27px; font-weight: 600; color: var(--text); }
  .login-box p { margin: 0; color: var(--muted); font-size: 17px; }
  .field { position: relative; margin-top: 30px; text-align: left; }
  .field input { width: 100%; height: 58px; padding: 0 16px; border: 1.5px solid #c6d1cb; border-radius: 12px; background: #fff; font-size: 20px; letter-spacing: 2px; transition: border-color .15s ease; }
  .field input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
  .field label { position: absolute; left: 14px; top: 16px; padding: 0 5px; background: #fff; color: var(--muted); font-size: 17px; pointer-events: none; transition: top .15s ease, font-size .15s ease, color .15s ease; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: -10px; font-size: 13.5px; color: var(--green); }
  .login-box .btns { margin-top: 22px; }
  .login-box .warn { text-align: left; }
  .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
  .spin { width: 44px; height: 44px; border: 4px solid #dbe3df; border-top-color: var(--green); border-radius: 50%; animation: spinBig .8s linear infinite; }
  @keyframes spinBig { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="boot" id="boot"><svg class="login-logo" viewBox="0 0 960.55 484.69" aria-hidden="true"><use href="#luxkorLogo"></use></svg><div class="spin"></div></div>

<div id="login" class="login" hidden>
  <span class="deco d1"></span><span class="deco d2"></span><span class="deco d3"></span><span class="deco d4"></span>
  <form class="login-box" id="loginForm" autocomplete="off">
    <svg class="login-logo" viewBox="0 0 960.55 484.69" role="img" aria-label="Lux Kor Hospital"><use href="#luxkorLogo"></use></svg>
    <h1>เข้าสู่ระบบ</h1>
    <p>นับ Stock คลัง Pharmacy F1</p>
    <div class="field">
      <input id="inPin" type="password" inputmode="numeric" maxlength="12" placeholder=" " required>
      <label for="inPin">รหัสพนักงาน</label>
    </div>
    <div class="warn red" id="loginErr" hidden></div>
    <div class="btns"><button class="btn pri" id="loginBtn" type="submit">เข้าสู่ระบบ</button></div>
  </form>
</div>

<div id="app" hidden>
  <div class="top"><div class="top-in">
    <button class="iconbtn" id="backBtn" type="button" aria-label="ย้อนกลับ" hidden>‹</button>
    <h1 id="topTitle">นับ Stock ห้องยา</h1>
    <button class="pill" id="syncPill" type="button">พร้อม</button>
  </div></div>
  <div class="wrap" id="view"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="top"><div class="top-in">
    <button class="iconbtn" id="sheetClose" type="button" aria-label="ปิด">‹</button>
    <h1 id="sheetTitle">บันทึกการนับ</h1>
  </div></div>
  <div class="wrap" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="pinModal" hidden>
  <form class="card" id="pinForm" autocomplete="off">
    <div class="title" id="pinTitle">ยืนยันการยกเลิก</div>
    <div class="sub" id="pinWhat" style="margin-top:4px"></div>
    <label class="f" for="pinInput">รหัสพนักงาน</label>
    <input class="t" id="pinInput" type="password" inputmode="numeric" maxlength="12">
    <div id="pinQtyBox" hidden><label class="f" for="pinQty">จำนวน</label><input class="t" id="pinQty" type="number" inputmode="decimal" min="0" step="any"></div>
    <div class="warn red" id="pinErr" hidden></div>
    <div class="btns two">
      <button class="btn ghost" type="button" id="pinNo">ไม่ยกเลิก</button>
      <button class="btn pri" type="submit" id="pinYes">ยืนยัน</button>
    </div>
  </form>
</div>

<div class="save-overlay" id="saveOverlay" aria-live="polite">
  <div class="save-success" id="saveSuccess">
    <svg class="check-circle" viewBox="0 0 80 80"><circle class="check-circle-bg" cx="40" cy="40" r="36"></circle><path class="check-mark" d="M24 41 L35 52 L57 28"></path></svg>
    <svg class="save-success-logo" viewBox="0 0 960.55 484.69" aria-label="Lux Kor Hospital"><use href="#luxkorLogo"></use></svg>
    <div class="save-success-text" id="saveText">บันทึกสำเร็จ</div>
    <div class="save-success-text" id="saveDetail" style="font-size:26px"></div>
  </div>
</div>

  function natural(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); }
  function modeDrugs() { return S.mode === 'slot' ? S.drugs.filter(function (d) { return d.slot; }) : S.drugs; }
  // Location มาจาก Index col L เท่านั้น: ยาที่มี Location = ช่องจ่าย, โหมดชั้น stock แสดงเฉพาะยาที่ยังไม่มี Location (ยาอื่นค้นหาได้)
  function workDrugs() { return modeDrugs().filter(function (d) { return S.mode === 'slot' || !d.slot; }); }
  function groupsOf(d) {
    return S.mode === 'slot' ? [slotGroup(d.slot)] : [UNKNOWN];
  }
  function isDone(d) { return rowsOf(d.c, S.mode).length > 0; }
  function groups() {
    var g = {};
    workDrugs().forEach(function (d) {
      groupsOf(d).forEach(function (k) { (g[k] = g[k] || []).push(d); });
    });
    return Object.keys(g).sort(function (a, b) {
      if (a === UNKNOWN) return 1; if (b === UNKNOWN) return -1; return natural(a, b);
    }).map(function (k) { return { k: k, list: g[k] }; });
  }
  function groupList(k) {
    var l = workDrugs().filter(function (d) { return groupsOf(d).indexOf(k) >= 0; });
    return l.sort(function (a, b) { return S.mode === 'slot' ? natural(a.slot, b.slot) : natural(a.sl || 'zz', b.sl || 'zz'); });
  }

  // ── หน้าจอ ──
  function render() {
    var v = $('view'), back = $('backBtn');
    back.hidden = !S.group;
    $('topTitle').textContent = S.group === 'EXP' ? 'คลัง EXP' : (S.group ? 'ช่องจ่าย ' + S.group : 'นับ Stock ห้องยา');
    if (S.group === 'EXP') { v.innerHTML = expHtml(); return; }
    if (S.group && S.group.indexOf('BOX:') === 0) { var bx = S.group.slice(4); $('topTitle').textContent = boxLabel(bx); v.innerHTML = boxHtml(bx); return; }
    if (S.group === 'NEAR') { $('topTitle').textContent = 'ใกล้หมดอายุ'; v.innerHTML = nearHtml(); return; }
    if (dailyOn()) { renderDaily(v); return; }
    if (S.group) { v.innerHTML = listHtml(groupList(S.group)); return; }
    var all = workDrugs(), done = all.filter(isDone).length, pct = all.length ? Math.round(done * 100 / all.length) : 0, keep = S.q;
    var h = 
      (all.length ? '<div class="prog"><div class="prog-t"><span>นับแล้ว ' + done + ' จาก ' + all.length + ' รายการ</span><span>' + pct + '%</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' : '') +
      '<div class="search"><input class="t" id="q" type="search" placeholder="ค้นหาชื่อยาหรือรหัส" value="' + esc(keep) + '" autocomplete="off"></div>' +
      '<div id="res"></div>' + reportBtn() +
      '<div class="sub" style="margin-top:22px;text-align:center">ผู้นับ: ' + esc(S.by) + ' · <button type="button" class="link" id="logout">เปลี่ยนผู้นับ</button></div>';
    v.innerHTML = h;
    drawResults();
    $('q').addEventListener('input', function (e) { S.q = e.target.value; drawResults(); });
  }
  function drawResults() {
    var box = $('res'); if (!box) return;
    var q = S.q.trim().toLowerCase();
    if (q) {
      var hit = modeDrugs().filter(function (d) { return d.n.toLowerCase().indexOf(q) >= 0 || d.c.indexOf(q) >= 0; }).slice(0, 40);
      box.innerHTML = (hit.length ? listHtml(hit) : '<div class="empty">ไม่พบยานี้ในรายการ</div>') +
        '<div class="btns"><button class="btn ghost" type="button" data-off="1">ยาไม่อยู่ในรายการ</button></div>';
      return;
    }
    if (!groups().length) { box.innerHTML = '<div class="empty">ค้นหาชื่อยาเพื่อบันทึกของสำรองบนชั้น stock</div>'; return; }
    var expCodes = Object.keys(S.expInv || {});
    box.innerHTML = '<div class="grid">' + (expCodes.length ? '<button type="button" class="tile exp" data-group="EXP"><b>EXP</b><span>' + expCodes.length + ' รายการ</span></button>' : '') + nearTile() + groups().map(function (g) {
      var d = g.list.filter(isDone).length, ok = d === g.list.length;
      return '<button type="button" class="tile' + (ok ? ' done' : '') + (g.k.length > 3 ? ' small' : '') + '" data-group="' + esc(g.k) + '"><b>' + esc(g.k) + '</b><span>' + d + '/' + g.list.length + '</span></button>';
    }).join('') + '</div>';
  }
  // รายการในคลัง EXP มาจาก EXP Inventory เท่านั้น เปลี่ยนตามยาที่ย้ายเข้ามา
  function expDays(s) {
    var my = /^(\d{1,2})\/(\d{4})$/.exec(s || '');
    if (my) return new Date(Number(my[2]), Number(my[1]), 0).getTime();   // ระบุแค่เดือน นับถึงวันสุดท้ายของเดือน
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || '');
    if (!m) return Infinity;
    var a = Number(m[1]), b = Number(m[2]);   // บางแถวใน EXP Inventory เป็น เดือน/วัน/ปี เช่น 7/31/2026
    return b > 12 ? new Date(Number(m[3]), a - 1, b).getTime() : new Date(Number(m[3]), b - 1, a).getTime();
  }
  // หมดอายุตั้งแต่วันถัดจากวันที่ระบุ ตรงกับ syncStockCountExpired_ ถ้าอ่านวันที่ไม่ได้ให้ถือว่าหมดอายุไว้ก่อน
  function isExpired(l) {
    var t = expDays(l.exp), now = new Date();
    return t === Infinity || t < new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }
  function daysLeft(l) {
    var now = new Date();
    return Math.round((expDays(l.exp) - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) / 86400000);
  }
  var NEAR_DAYS = 180;   // เริ่มติด NEAR EXP ก่อนหมดอายุ 180 วัน
  function expTag(expired, days) {
    if (expired) return '<span class="had exp">EXP</span>';
    return (days <= NEAR_DAYS ? '<span class="had near">NEAR EXP</span>' : '') + '<span class="had near">' + num(days) + ' วัน</span>';
  }
  // Lot ในคลังปกติที่เหลือไม่เกิน 180 วัน หลังปิดยอดใช้รายการจากระบบ ไม่มียอดเพื่อให้ยังนับแบบไม่เห็นยอด
  function nearList() {
    var src = dailyOn() ? ((S.daily && S.daily.near) || []) : S.rows.filter(function (r) { return Number(r.q) > 0 && r.exp; }).map(function (r) {
      var d = S.byCode[r.c] || {}; return { c: r.c, n: d.n || r.c, u: d.u || '', loc: r.loc, lot: r.lot, exp: r.exp, q: Number(r.q) };
    });
    return src.filter(function (l) { return expDays(l.exp) !== Infinity && daysLeft(l) <= NEAR_DAYS; }).sort(function (a, b) { return expDays(a.exp) - expDays(b.exp); });
  }
  // ยาที่ยังไม่ถึง 180 วัน แสดงจำนวนวันของ Lot ที่หมดอายุก่อน
  function farDays(d) {
    var lots = dailyOn() ? (d.lots || []) : (S.rows || []).filter(function (r) { return r.c === d.c && Number(r.q) > 0; });
    var days = lots.filter(function (l) { return l.exp && expDays(l.exp) !== Infinity && !isExpired(l); }).map(daysLeft);
    return days.length ? expTag(false, Math.min.apply(null, days)) : '';
  }
  function nearOf(c) { return nearList().filter(function (l) { return l.c === c; }); }
  function nearTile() { var n = nearList().length; return boxTilesAfter(n ? '<button type="button" class="tile near-t small" data-group="NEAR"><b>NEAR EXP</b><span>' + n + ' Lot</span></button>' : ''); }
  function boxTilesAfter(h) { return h + boxTiles(); }
  function nearHtml() {
    var list = nearList();
    if (!list.length) return '<div class="empty">ไม่มี Lot ที่เหลือไม่เกิน 180 วัน</div>';
    return '<div class="list">' + list.map(function (l, i) {
      return '<div class="item static"><div class="nm">' + esc(l.n) + lotTag(l) + '</div><div class="sub">' + esc(l.loc || '-') + ' · ' + esc(l.lot || 'ไม่มี Lot') + ' · ' + esc(l.exp) + (l.q ? ' · ' + num(l.q) + ' ' + esc(l.u) : '') + '</div>' +
        '<div class="btns"><button class="btn sec" type="button" data-toexp="' + i + '">เข้าคลัง EXP</button></div></div>';
    }).join('') + '</div>';
  }
  function lotTag(l) { return l.x ? '<span class="had xl">EXCHANGE LOSS</span>' : expTag(isExpired(l), daysLeft(l)); }
  // Lot ที่ยังอยู่ในคลัง EXP จริง ไม่รวมแถว Exchange Loss ที่ส่งคืนบริษัทแล้ว
  function expLots(c) { return ((S.expInv || {})[c] || []).filter(function (l) { return !l.x; }); }
  function expTags(lots) {
    var out = lots.some(isExpired) ? expTag(true) : '';
    var near = lots.filter(function (l) { return !isExpired(l); }).map(daysLeft);
    return near.length ? out + expTag(false, Math.min.apply(null, near)) : out;   // หลาย Lot แสดง Lot ที่ใกล้หมดอายุที่สุด
  }
  function expHtml() {
    var inv = S.expInv || {}, items = Object.keys(inv).map(function (c) {
      var d = S.byCode[c] || {};
      return { c: c, name: d.n || (inv[c][0] && inv[c][0].n) || c, u: d.u || '', lots: inv[c].slice().sort(function (a, b) { return expDays(a.exp) - expDays(b.exp); }) };
    }).sort(function (a, b) { return expDays(a.lots[0].exp) - expDays(b.lots[0].exp); });
    if (!items.length) return '<div class="empty">ยังไม่มียาในคลัง EXP</div>';
    return '<div class="list">' + items.map(function (x) {
      var mixed = x.lots.some(function (l) { return lotTag(l) !== lotTag(x.lots[0]); });   // ยาตัวเดียวมีหลายสถานะ ให้ติดแท็กราย Lot
      return '<div class="item static"><div class="nm">' + esc(x.name) + (mixed ? '' : lotTag(x.lots[0])) + '</div>' + x.lots.map(function (l) {
        return '<div class="sub">' + esc(l.lot || 'ไม่มี Lot') + ' · ' + esc(l.exp || '-') + ' · ' + num(l.q) + (x.u ? ' ' + esc(x.u) : '') + (l.x ? ' · ส่งคืนบริษัทแล้ว' : '') + (mixed ? lotTag(l) : '') + '</div>' +
          (!l.x && !isExpired(l) ? '<div class="btns"><button class="btn ghost" type="button" data-back="' + esc(x.c) + '|' + esc(l.row) + '">คืนมาคลังปกติ</button></div>' : '');
      }).join('') + '</div>';
    }).join('') + '</div>';
  }
  function listHtml(list) {
    return '<div class="list">' + list.map(function (d) {
      var r = rowsOf(d.c, S.mode), tot = r.reduce(function (s, x) { return s + Number(x.q || 0); }, 0);
      return '<button type="button" class="item' + (r.length ? ' done' : '') + '" data-code="' + esc(d.c) + '">' +
        ((d.sl || d.slot) ? '<span class="loc">' + esc(S.mode === 'slot' ? d.slot : (d.sl || d.slot)) + '</span>' : '') +
        '<span class="nm">' + esc(d.n) + tags(d) + '</span>' +
        '<span class="st">' + (r.length ? num(tot) + ' ' + esc(d.u) + '<br>' + r.length + ' Lot' : '') + '</span></button>';
    }).join('') + '</div>';
  }

  // ── นับประจำวัน: ใช้หน้าตาเดียวกับการนับรอบใหญ่ แสดงเฉพาะยาที่เคลื่อนไหวหลังนับครั้งล่าสุด ──
  function dailyOn() { return !!(S.closed || S.dTest); }
  function getJson(q) { return fetch(WEBAPP_URL + '?action=' + q + '&pin=' + encodeURIComponent(S.pin) + (S.dTest ? '&test=1' : '')).then(function (r) { return r.json(); }); }
  function loadDaily() {
    if (!dailyOn() || !S.pin) return Promise.resolve();
    return getJson('getDailyCountPlan').then(function (d) {
      if (d.status === 'ok' && d.open) { S.daily = d; if ($('sheet').hidden) render(); }
    }).catch(function () { /* ใช้รายการเดิม */ });
  }
  function dailyItems() { return (S.daily && S.daily.items) || []; }
  function dailyGroups() {
    var g = {};
    dailyItems().forEach(function (d) { var k = slotGroup(d.loc || '-'); (g[k] = g[k] || []).push(d); });
    return Object.keys(g).sort(natural).map(function (k) { return { k: k, list: g[k].sort(function (a, b) { return natural(a.loc, b.loc); }) }; });
  }
  function dailyListHtml(list) {
    if (!list.length) return '<div class="empty">ไม่มีรายการในกลุ่มนี้</div>';
    return '<div class="list">' + list.map(function (d) {
      var mark = d.recount ? '<span class="had near">นับซ้ำ</span>' : (d.check ? '<span class="had near">ตรวจคลัง</span>' : '');
      return '<button type="button" class="item' + (d.done ? ' done' : '') + '"' + (d.done ? '' : ' data-daily="' + esc(d.c) + '"') + '>' +
        '<span class="loc">' + esc(d.loc || '-') + '</span><span class="nm">' + esc(d.n) + tags(d) + mark + '</span>' +
        '<span class="st">' + (d.done ? esc(d.done) : '') + '</span></button>';
    }).join('') + '</div>';
  }
  function renderDaily(v) {
    if (S.group === 'REVIEW') { $('topTitle').textContent = 'รอเภสัชกรตรวจ'; v.innerHTML = reviewHtml(); return; }
    if (S.group === 'STOCK') { $('topTitle').textContent = 'ยอดคงเหลือ'; v.innerHTML = '<div class="search"><input class="t" id="sq" type="search" placeholder="ค้นหาชื่อยา รหัส หรือช่อง" value="' + esc(S.sq || '') + '" autocomplete="off"></div><div id="sres"></div>'; drawStock(); $('sq').addEventListener('input', function (e) { S.sq = e.target.value; drawStock(); }); return; }
    if (S.group) {
      var key = S.group.slice(2), g = dailyGroups().filter(function (x) { return x.k === key; })[0];
      $('topTitle').textContent = 'นับประจำวัน ' + key; v.innerHTML = dailyListHtml(g ? g.list : []); return;
    }
    $('topTitle').textContent = 'นับประจำวัน';
    var items = dailyItems(), done = items.filter(function (d) { return d.done; }).length, pct = items.length ? Math.round(done * 100 / items.length) : 0, q = (S.dq || '').trim().toLowerCase();
    var expCodes = Object.keys(S.expInv || {});
    v.innerHTML = (S.daily ? '<div class="prog"><div class="prog-t"><span>นับแล้ว ' + done + ' จาก ' + items.length + ' รายการ</span><span>' + pct + '%</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' : '<div class="empty">กำลังโหลดรายการ</div>') +
      '<div class="search"><input class="t" id="dq" type="search" placeholder="ค้นหาชื่อยาหรือรหัส" value="' + esc(S.dq || '') + '" autocomplete="off"></div><div id="dres"></div>' +
      (S.daily ? '<div class="btns" style="margin-top:12px"><button class="btn pri" type="button" id="dPrint">ตรวจสอบและพิมพ์ใบสรุป A4 (เครื่องห้องยา)</button></div>' +
        '<div class="btns" style="margin-top:8px"><button class="btn sec" type="button" id="dPdf">บันทึกเป็น PDF / พิมพ์จากมือถือ</button></div><div class="sub" id="dPrintSt" style="text-align:center"></div>' : '') + reportBtn() +
      '<div class="sub" style="margin-top:22px;text-align:center">ผู้นับ: ' + esc(S.by) + ' · <button type="button" class="link" id="logout">เปลี่ยนผู้นับ</button></div>';
    var draw = function () {
      var t = (S.dq || '').trim().toLowerCase();
      if (t) { $('dres').innerHTML = dailyListHtml(items.filter(function (d) { return d.n.toLowerCase().indexOf(t) >= 0 || d.c.indexOf(t) >= 0; })); return; }
      $('dres').innerHTML = '<div class="grid">' +
        (expCodes.length ? '<button type="button" class="tile exp" data-group="EXP"><b>EXP</b><span>' + expCodes.length + ' รายการ</span></button>' : '') + nearTile() +
        (S.pharm ? '<button type="button" class="tile gold small" data-group="REVIEW"><b>รอตรวจ</b><span>' + ((S.daily && S.daily.review) || 0) + ' รายการ</span></button><button type="button" class="tile small" data-group="STOCK"><b>ยอดคงเหลือ</b><span>ดูยอด</span></button>' : '') +
        dailyGroups().map(function (g) {
          var d = g.list.filter(function (x) { return x.done; }).length, ok = d === g.list.length;
          return '<button type="button" class="tile' + (ok ? ' done' : '') + (g.k.length > 3 ? ' small' : '') + '" data-group="D:' + esc(g.k) + '"><b>' + esc(g.k) + '</b><span>' + d + '/' + g.list.length + '</span></button>';
        }).join('') + '</div>' + (S.daily && !items.length ? '<div class="empty">ไม่มีรายการที่ต้องนับ</div>' : '');
    };
    draw();
    $('dq').addEventListener('input', function (e) { S.dq = e.target.value; draw(); });
    if ($('dPrint')) $('dPrint').addEventListener('click', printDailySheet);
    if ($('dPdf')) $('dPdf').addEventListener('click', pdfDailySheet);
  }
  // ── ใบนับหลังนับ เปิดในหน้าใหม่ แล้วสั่งพิมพ์ของมือถือ (เลือก "บันทึกเป็น PDF" หรือเครื่องพิมพ์) ──
  function pdfDailySheet(force) {
    var left = dailyItems().filter(function (d) { return !d.done; }).length, st = $('dPrintSt'), btn = $('dPdf');
    if (force !== true && left && !confirm('ยังมียาที่ต้องนับอีก ' + left + ' รายการ\nกด ตกลง เพื่อทำใบที่ยังไม่ครบ หรือ ยกเลิก เพื่อกลับไปนับให้ครบ')) return;
    var w = window.open('', '_blank');   // เปิดหน้าต่างทันทีตอนกด กันเบราว์เซอร์บล็อก pop-up
    if (w) w.document.write('<p style="font-family:sans-serif;padding:24px">กำลังสร้างใบนับ…</p>');
    btn.disabled = true; st.textContent = 'กำลังสร้างใบนับ…';
    post({ action: 'getDailyCountSheetHtml', pin: S.pin, force: left || force === true ? 1 : 0, test: S.dTest ? 1 : 0 }).then(function (r) {
      btn.disabled = false; st.textContent = '';
      if (r.status === 'todo') { if (w) w.close(); if (confirm(r.msg + '\nกด ตกลง เพื่อทำใบที่ยังไม่ครบ')) pdfDailySheet(true); loadDaily(); return; }
      if (r.status !== 'ok') { if (w) w.close(); st.textContent = r.msg || 'สร้างใบนับไม่สำเร็จ'; return; }
      var html = r.html.replace('</body>', '<script>(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){window.print()},300)})<\/script></body>');
      if (w) { w.document.open(); w.document.write(html); w.document.close(); }
      else { var u = URL.createObjectURL(new Blob([html], { type: 'text/html' })); location.href = u; }
      st.textContent = 'เปิดใบนับแล้ว ในหน้าพิมพ์เลือก "บันทึกเป็น PDF" หรือเลือกเครื่องพิมพ์';
    }).catch(function () { btn.disabled = false; if (w) w.close(); st.textContent = 'เชื่อมต่อไม่ได้ กรุณาลองใหม่'; });
  }
  // ── ใบสรุปนับประจำวัน A4: ตรวจว่านับครบ แล้วส่งพิมพ์ที่เครื่อง A4 ห้องยา (ผ่าน LKPC-08) ──
  function printDailySheet(force) {
    var btn = $('dPrint'), st = $('dPrintSt'), left = dailyItems().filter(function (d) { return !d.done; }).length;
    if (force !== true && left && !confirm('ยังมียาที่ต้องนับอีก ' + left + ' รายการ\nกด ตกลง เพื่อพิมพ์ใบที่ยังไม่ครบ หรือ ยกเลิก เพื่อกลับไปนับให้ครบ')) return;
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบและส่งพิมพ์…'; st.textContent = '';
    post({ action: 'printDailyCountSheet', pin: S.pin, force: left || force === true ? 1 : 0, test: S.dTest ? 1 : 0 }).then(function (r) {
      btn.disabled = false; btn.textContent = 'ตรวจสอบและพิมพ์ใบสรุป A4';
      if (r.status === 'todo') { if (confirm(r.msg + '\nกด ตกลง เพื่อพิมพ์ใบที่ยังไม่ครบ')) printDailySheet(true); loadDaily(); return; }
      if (r.status !== 'ok') { st.textContent = r.msg || 'ส่งพิมพ์ไม่สำเร็จ'; return; }
      st.textContent = 'ส่งไปเครื่องพิมพ์ห้องยาแล้ว (' + r.rows + ' รายการ) กำลังรอพิมพ์…';
      var tries = 0, poll = function () {

  function askBack(key) {
    var p = key.split('|'), l = ((S.expInv || {})[p[0]] || []).filter(function (x) { return String(x.row) === p[1]; })[0]; if (!l) return;
    askMove({ action: 'returnStockFromExp', code: p[0], lot: l.lot, row: l.row }, 'คืนมาคลังปกติ', ((S.byCode[p[0]] || {}).n || l.n) + ' · Lot ' + (l.lot || '-') + ' · EXP ' + l.exp, l.q, false);
  }
  function askNoLot() { openPin('nolot', 'ยืนยันว่าไม่มีเลข Lot', 'ใส่รหัสพนักงานเพื่อยืนยันว่ากล่องนี้ไม่มีเลข Lot', 'ไม่ยืนยัน'); }
  // (2026-11-08 ผู้ใช้สั่ง) "ไม่มีของ" ต้องใส่รหัสพนักงานก่อนบันทึกทุกครั้ง กันมือลั่น
  var noneGo = null;
  function askNone(name, go) { noneGo = go; openPin('none', 'ยืนยันว่าไม่มีของ', (name ? name + ' · ' : '') + 'ใส่รหัสพนักงานเพื่อยืนยันว่าไม่พบยานี้เลย (จำนวน 0)', 'ไม่ยืนยัน'); }
  function cancelRow(id) {
    var typed = /^row:(\d+)$/.exec(id);
    var r = (typed ? rowsOf(form.d.c)[Number(typed[1])] : allRows().filter(function (x) { return x.id === id; })[0]) || {};
    cancelId = id; cancelTarget = r;
    openPin('cancel', 'ยืนยันการยกเลิก', 'Lot ' + (r.lot || '-') + ' · EXP ' + (r.exp || '-') + ' · จำนวน ' + num(r.q), 'ไม่ยกเลิก');
  }
  function closePin() { $('pinModal').hidden = true; cancelId = ''; }
  function pinFail(m) { $('pinErr').textContent = m; $('pinErr').hidden = false; $('pinYes').disabled = false; }
  function confirmCancel() {
    var id = cancelId, pin = $('pinInput').value.trim();
    if (!pin) return pinFail('กรุณาใส่รหัสพนักงาน');
    if (pinMode === 'move') {
      var mq = Number($('pinQty').value);
      if (!(mq > 0)) return pinFail('กรุณาระบุจำนวน');
      $('pinYes').disabled = true;
      post(Object.assign({}, moveReq, { pin: pin, qty: mq })).then(function (r) {
        $('pinYes').disabled = false;
        if (r.status !== 'ok') return pinFail(r.msg || 'บันทึกไม่สำเร็จ');
        if (moveReq.action === 'cancelBoxStock') { var did = moveReq.id; S.boxes = (S.boxes || []).filter(function (x) { return x.id !== did; }); drawLots(); }
        closePin(); success('บันทึกสำเร็จ', r.warn || ''); S.loading = false; refresh(true);
      }).catch(function () { pinFail('บันทึกไม่ได้ ต้องต่ออินเทอร์เน็ต'); });
      return;
    }
    if (pinMode === 'none') {
      if (pin !== S.pin) return pinFail('รหัสพนักงานไม่ถูกต้อง');
      var go = noneGo; noneGo = null; closePin(); if (go) go(); return;
    }
    if (pinMode === 'nolot') {
      if (pin !== S.pin) return pinFail('รหัสพนักงานไม่ถูกต้อง');
      $('fNoLot').checked = true; $('fLot').value = ''; $('fLot').disabled = true; form.confirmed = ''; closePin(); return;
    }
    var q = S.queue.filter(function (x) { return x.id === id; })[0];
    if (q) {
      if (pin !== S.pin) return pinFail('รหัสพนักงานไม่ถูกต้อง');
      if (S.flushing && !q.failed) return pinFail('กำลังส่งรายการนี้ ลองใหม่อีกครู่');
      S.queue = S.queue.filter(function (x) { return x.id !== id; }); save(K_QUEUE, S.queue); pill(); drawLots(); closePin(); success('ยกเลิกแล้ว'); return;
    }
    $('pinYes').disabled = true;
    var target = cancelTarget, req = target && !target.id
      ? { action: 'cancelStockCount', pin: pin, code: target.c, lot: target.lot, qty: target.q }
      : { action: 'cancelStockCount', pin: pin, id: id };
    var tries = 0, send = function () { return post(req).then(function (r) {   // ระบบไม่ว่างให้ลองซ้ำเอง
      if (r.retry && ++tries < 4) { $('pinErr').textContent = 'ระบบกำลังบันทึกรายการอื่น กำลังลองใหม่…'; $('pinErr').hidden = false; return new Promise(function (ok) { setTimeout(ok, 3000); }).then(send); }
      return r;
    }); };
    send().then(function (r) {
      $('pinYes').disabled = false;
      if (r.status !== 'ok') return pinFail(r.msg || 'ยกเลิกไม่สำเร็จ');
      S.rows = S.rows.filter(function (x) { return x !== target && (!id || x.id !== id); }); save(K_PLAN, { drugs: S.drugs, rows: S.rows, off: S.off, expInv: S.expInv }); drawLots(); closePin(); success('ยกเลิกแล้ว');
    }).catch(function () { pinFail('ยกเลิกไม่ได้ ต้องต่ออินเทอร์เน็ต'); });
  }

  // ── เหตุการณ์ ──
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'logout') { S.pin = ''; S.by = ''; save(K_USER, null); save(K_PLAN, null); $('inPin').value = ''; showLogin(); }
    else if (t.dataset.mode) { S.mode = t.dataset.mode; S.q = ''; render(); }
    else if (t.dataset.group) { S.group = t.dataset.group; if (S.group === 'REVIEW') loadReview(); if (S.group === 'STOCK') loadStock(); history.pushState({ g: 1 }, ''); render(); scrollTo(0, 0); }
    else if (t.dataset.daily) openDaily(t.dataset.daily);
    else if (t.dataset.report) openReport();
    else if (t.dataset.toexp !== undefined) askToExp(t.dataset.toexp);
    else if (t.dataset.boxadd) openBox(t.dataset.boxadd);
    else if (t.dataset.boxcode) { var bi = t.dataset.boxcode.split('|'); openEntry(bi[1], false, false, bi[0]); }
    else if (t.dataset.boxdel) askBoxDel(t.dataset.boxdel);
    else if (t.dataset.back) askBack(t.dataset.back);
    else if (t.dataset.rev) openReview(t.dataset.rev);
    else if (t.dataset.code) openEntry(t.dataset.code);
    else if (t.dataset.off) openEntry('', true);
    else if (t.dataset.cancel) cancelRow(t.dataset.cancel);
    else if (t.dataset.lot) {
      $('fLot').value = t.dataset.lot; form.confirmed = '';
      var p = /^(?:(\d\d)\/)?(\d\d)\/(\d{4})$/.exec(t.dataset.exp || '');
      if (p) { $('fD').value = p[1] || ''; $('fM').value = p[2]; $('fY').value = p[3]; }
    }
  });
  $('backBtn').addEventListener('click', function () { history.back(); });
  $('sheetClose').addEventListener('click', closeSheet);
  $('pinNo').addEventListener('click', closePin);
  $('pinForm').addEventListener('submit', function (e) { e.preventDefault(); confirmCancel(); });
  $('syncPill').addEventListener('click', function () {
    S.queue.forEach(function (x) { delete x.failed; }); save(K_QUEUE, S.queue);
    flush(); refresh(); toast('กำลังอัปเดตข้อมูล');
  });
  window.addEventListener('popstate', function () {
    if (!$('sheet').hidden) { hideSheet(); return; }
    if (S.group) { S.group = null; render(); }
  });

  function showLogin() { $('boot').hidden = true; $('app').hidden = true; $('login').hidden = false; }
  function enter() { $('boot').hidden = true; $('login').hidden = true; $('app').hidden = false; render(); pill(); flush(); }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('inPin').value.trim(), btn = $('loginBtn'), er = $('loginErr');
    if (!pin) return;
    btn.disabled = true; btn.textContent = 'กำลังโหลดรายการยา…'; er.hidden = true;
    fetchPlan(pin).then(function (d) {
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      if (d.status !== 'ok') { er.textContent = d.msg || 'เข้าสู่ระบบไม่สำเร็จ'; er.hidden = false; return; }
      S.pin = pin; S.by = d.me; save(K_USER, { pin: pin, by: d.me }); applyPlan(d); enter();
    }).catch(function () { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; er.textContent = 'เชื่อมต่อไม่ได้ กรุณาตรวจอินเทอร์เน็ต'; er.hidden = false; });
  });

  function boot() {
    S.dTest = /[?&]daily=1/.test(location.search);   // ทดสอบก่อนปิดยอด ใช้ได้เฉพาะรหัสผู้ดูแลระบบ
    S.queue = load(K_QUEUE, []); S.loc = load(K_LOC, '');
    S.queue.forEach(function (x) { delete x.failed; });   // เปิดแอปใหม่ ลองส่งรายการที่ค้างอีกครั้ง (ID กันบันทึกซ้ำ)
    var u = load(K_USER, null), cached = load(K_PLAN, null);
    if (!u || !u.pin) { showLogin(); return; }
    S.pin = u.pin; S.by = u.by; $('inPin').value = u.pin;
    if (cached && cached.drugs) { applyPlan(cached); enter(); }   // แสดงทันที แล้วอัปเดตเบื้องหลัง
    fetchPlan(u.pin).then(function (d) {
      if (d.status === 'ok') {
        S.by = d.me; applyPlan(d);
        if ($('app').hidden) enter(); else if ($('sheet').hidden) { render(); pill(); }
      } else { S.pin = ''; save(K_USER, null); save(K_PLAN, null); showLogin(); }
    }).catch(function () {
      if (!$('app').hidden) { toast('เชื่อมต่อไม่ได้ ใช้ข้อมูลล่าสุดในเครื่อง'); pill(); return; }
      S.pin = ''; showLogin(); $('loginErr').textContent = 'เชื่อมต่อไม่ได้ กรุณาตรวจอินเทอร์เน็ต'; $('loginErr').hidden = false;
    });
  }
  boot();
})();
</script>
</body>
</html>
